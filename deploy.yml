name: Deploy to Hetzner

# Runs on every push to main (i.e. every merged PR) and can be started by hand
# from the Actions tab. It SSHes into the server and does exactly what the manual
# deploy did: git pull, npm install only if package.json changed, pm2 restart.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   HETZNER_HOST     server IP or hostname
#   HETZNER_USER     SSH username used to log in
#   HETZNER_SSH_KEY  private key whose public half is in ~/.ssh/authorized_keys on the server
#   HETZNER_PORT     (optional) SSH port, defaults to 22

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ~/thirty-one-game
            echo "== before: $(git rev-parse --short HEAD)"

            # Never let local edits block the pull; keep them on the stash just in case
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push -m "auto-deploy $(date -u +%FT%TZ)" >/dev/null
              echo "   stashed local changes"
            fi

            git fetch origin main
            git checkout -q main
            git reset -q --hard origin/main
            echo "== after:  $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

            # Install deps only when the dependency files changed in this deploy
            if git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -qE '^(package\.json|package-lock\.json)$'; then
              echo "== package.json changed: npm install"
              npm install --omit=dev --no-audit --no-fund
            else
              echo "== dependencies unchanged"
            fi

            pm2 restart blitz31 --update-env
            sleep 3
            pm2 describe blitz31 | grep -E "status|restarts" || true

            # Health check: the server must answer on its port
            if curl -sf -o /dev/null --max-time 10 http://127.0.0.1:3000/; then
              echo "== health check OK"
            else
              echo "!! health check FAILED - last 40 log lines:"
              pm2 logs blitz31 --lines 40 --nostream || true
              exit 1
            fi
