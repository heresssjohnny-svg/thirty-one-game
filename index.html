<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>31! Card Game</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root { --bg-base: #044e36; --panel-bg: rgba(6, 95, 70, 0.9); --accent-gold: #facc15; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #044e36; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #044e36; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(250,204,21,0.3); }
        button { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.secondary { background: #1e293b; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #main-menu, #game-view { display: flex; flex-direction: column; gap: 12px; background: var(--panel-bg); padding: 20px; border-radius: 12px; width: 95%; max-width: 400px; }
        #game-view { display: none; width: 100%; height: 100%; max-width: none; border-radius: 0; background: transparent; justify-content: space-between; align-items: center; }
        input, select { background: #0f172a; border: 1px solid rgba(250, 204, 21, 0.3); padding: 8px; color: #fff; border-radius: 6px; width: 100%; }
        .table-oval { position: relative; width: 600px; height: 260px; background: #065f46; border: 6px solid #78350f; border-radius: 130px; margin: auto; display: flex; align-items: center; justify-content: center; }
        .seat { position: absolute; background: #0f172a; border: 2px solid #475569; padding: 4px; border-radius: 6px; font-size: 0.7rem; text-align: center; width: 100px; }
        .seat-0 { bottom: 5px; left: calc(50% - 50px); }
        .seat-1 { bottom: 30px; left: 10px; }
        .seat-2 { top: 30px; left: 10px; }
        .seat-3 { top: 5px; left: calc(50% - 50px); }
        .seat-4 { top: 30px; right: 10px; }
        .seat-5 { bottom: 30px; right: 10px; }
        .my-hand-area { background: #065f46; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 400px; }
        .cards-flex { display: flex; gap: 8px; }
        .my-card { width: 50px; height: 72px; background: #fff; color: #000; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight:900; color:var(--accent-gold);">31! Card Game</div>
        <div>
            <button class="secondary" id="vc-main-btn" onclick="toggleLiveKitMic()">🎙️ Voice: Off</button>
            <button class="danger" id="leave-lobby-btn" style="display:none;" onclick="leaveLobby()">Leave</button>
        </div>
    </header>
    <main>
        <div id="main-menu">
            <h2>Lobby Menu</h2>
            <label>Username</label>
            <input type="text" id="username-input">
            <label>Lobby Name</label>
            <input type="text" id="lobby-name-input" value="My Table">
            <button onclick="createLobby()">Create Lobby</button>
            <label>Join Code</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="lobby-code-input" placeholder="CODE">
                <button onclick="joinLobby()">Join</button>
            </div>
        </div>

        <div id="game-view">
            <div id="room-title-display" style="font-weight:bold; color:var(--accent-gold);">Lobby</div>
            <div id="turn-banner" style="color:var(--accent-gold);">Waiting...</div>
            <div class="table-oval" id="table-oval-container"></div>
            <div class="my-hand-area">
                <div id="my-score-display">Score: 0</div>
                <div class="cards-flex" id="my-cards-container"></div>
                <div style="display:flex; gap:6px;">
                    <button id="ready-btn" onclick="toggleReady()">Ready Up</button>
                    <button id="knock-btn" class="secondary" onclick="knockRound()" disabled>Knock</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        let ws = null;
        let pendingQueue = [];
        let isReadyState = false;
        let livekitRoom = null;
        let isLiveKitMuted = true;
        let latestHost = null;
        let latestToken = null;

        function connectSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host);

            ws.onopen = () => {
                while (pendingQueue.length > 0) ws.send(JSON.stringify(pendingQueue.shift()));
            };

            ws.onmessage = (event) => {
                let data = JSON.parse(event.data);
                if (data.type === 'LOBBY_JOINED' || data.type === 'GAME_STATE_UPDATE') {
                    updateUIFromLobby(data.lobby);
                    if (data.livekitHost && data.livekitToken) {
                        latestHost = data.livekitHost;
                        latestToken = data.livekitToken;
                        connectLiveKit(data.livekitHost, data.livekitToken);
                    }
                } else if (data.type === 'LEFT_LOBBY') {
                    if (livekitRoom) livekitRoom.disconnect();
                    resetToMainMenu();
                }
            };

            ws.onclose = () => { setTimeout(connectSocket, 3000); };
        }

        function initSocketAndSend(payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            } else {
                pendingQueue.push(payload);
                connectSocket();
            }
        }

        async function connectLiveKit(host, token) {
            if (!window.LivekitClient) return;
            try {
                if (livekitRoom) await livekitRoom.disconnect();
                livekitRoom = new LivekitClient.Room();
                livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) document.body.appendChild(track.attach());
                });
                await livekitRoom.connect(host, token);
                await livekitRoom.localParticipant.setMicrophoneEnabled(false);
                isLiveKitMuted = true;
                updateLiveKitUI();
            } catch (e) {}
        }

        async function toggleLiveKitMic() {
            if (!livekitRoom && latestHost && latestToken) await connectLiveKit(latestHost, latestToken);
            if (!livekitRoom) return;
            isLiveKitMuted = !isLiveKitMuted;
            await livekitRoom.localParticipant.setMicrophoneEnabled(!isLiveKitMuted);
            updateLiveKitUI();
        }

        function updateLiveKitUI() {
            let btn = document.getElementById('vc-main-btn');
            btn.innerText = isLiveKitMuted ? '🎙️ Voice: Off' : '🎙️ Voice: On';
        }

        function createLobby() {
            let username = document.getElementById('username-input').value.trim() || 'Player';
            let lobbyName = document.getElementById('lobby-name-input').value.trim();
            initSocketAndSend({ type: 'CREATE_LOBBY', username, lobbyName });
        }

        function joinLobby() {
            let username = document.getElementById('username-input').value.trim() || 'Player';
            let code = document.getElementById('lobby-code-input').value.toUpperCase();
            if (code) initSocketAndSend({ type: 'JOIN_LOBBY', code, username });
        }

        function toggleReady() {
            isReadyState = !isReadyState;
            document.getElementById('ready-btn').innerText = isReadyState ? 'Unready' : 'Ready Up';
            initSocketAndSend({ type: 'SET_READY', ready: isReadyState });
        }

        function knockRound() { initSocketAndSend({ type: 'KNOCK' }); }
        function leaveLobby() { initSocketAndSend({ type: 'LEAVE_LOBBY' }); }

        function resetToMainMenu() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('leave-lobby-btn').style.display = 'none';
            isReadyState = false;
            document.getElementById('ready-btn').innerText = 'Ready Up';
        }

        function updateUIFromLobby(lobby) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('leave-lobby-btn').style.display = 'inline-block';
            document.getElementById('room-title-display').innerText = `${lobby.name} [${lobby.code}]`;

            let activeUsername = document.getElementById('username-input').value.trim();
            let me = lobby.players.find(p => p.username === activeUsername);
            if (me) {
                isReadyState = me.ready;
                document.getElementById('ready-btn').innerText = me.ready ? 'Unready' : 'Ready Up';
            }

            let container = document.getElementById('table-oval-container');
            let html = '';
            lobby.players.forEach(p => {
                let readyMark = p.ready ? '✅' : '⏳';
                html += `<div class="seat seat-${p.seat}"><b>${readyMark} ${p.username}</b><br>Lives: ${p.lives}</div>`;
            });
            container.innerHTML = html;

            if (me && me.cards) {
                document.getElementById('my-cards-container').innerHTML = me.cards.map((c, i) => `<div class="my-card" onclick="initSocketAndSend({type:'DISCARD_CARD', cardIndex:${i}})"><span>${c.val}</span><span>${c.suit}</span></div>`).join('');
            }
        }

        window.onload = connectSocket;
    </script>
</body>
</html>
