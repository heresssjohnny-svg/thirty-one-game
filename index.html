<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>31! Card Game</title>

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#044e36">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="31!">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Official LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        :root {
            --bg-base: #044e36;
            --panel-bg: rgba(6, 95, 70, 0.9);
            --border-color: rgba(250, 204, 21, 0.3);
            --accent-cyan: #38bdf8;
            --accent-gold: #facc15;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        
        body { 
            background: radial-gradient(circle at center, #065f46 0%, #044e36 100%); 
            color: var(--text-main); 
            height: 100vh; 
            min-height: 500px;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .bg-card {
            position: absolute;
            width: 50px;
            height: 75px;
            background: #ffffff;
            color: #dc2626;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        
        header { 
            background: rgba(4, 78, 54, 0.95); 
            backdrop-filter: blur(10px);
            padding: 8px 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            flex-shrink: 0; 
            z-index: 1000; 
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .logo { 
            font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-shadow: 0 2px 10px rgba(250, 204, 21, 0.4);
        }
        
        .top-menu-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 10; }
        
        button { 
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.15); 
            padding: 6px 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.75rem; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s ease;
        }
        
        button:hover { 
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%); 
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
            transform: translateY(-1px);
        }
        
        button:active { transform: translateY(1px); }
        button:disabled { background: #1e293b; color: #475569; box-shadow: none; cursor: not-allowed; }
        button.danger { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        button.secondary { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.12); box-shadow: none; }
        button.secondary:hover { background: rgba(51, 65, 85, 0.95); }
        
        .vc-control-group {
            display: none; 
            align-items: center;
            gap: 4px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 3px 6px;
            border-radius: 6px;
        }

        .led-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background-color: #ef4444; 
            box-shadow: 0 0 6px #ef4444;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .led-indicator.active {
            background-color: #10b981; 
            box-shadow: 0 0 8px #10b981;
        }

        main { flex: 1; display: flex; flex-direction: column; padding: 10px; align-items: center; justify-content: center; overflow: hidden; position: relative; z-index: 10; width: 100%; max-width: 100vw; }
        
        #main-menu { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 95%; 
            max-width: 400px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 10;
            max-height: 85vh;
            overflow-y: auto;
        }

        #main-menu h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 2px;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(250, 204, 21, 0.3); 
            padding: 8px 10px; 
            color: var(--text-main); 
            border-radius: 6px; 
            font-size: 0.9rem; 
            outline: none;
            width: 100%;
        }

        .lobby-list-container { 
            max-height: 110px; 
            overflow-y: auto; 
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(250, 204, 21, 0.2); 
            border-radius: 6px; 
            padding: 4px; 
        }

        .lobby-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 8px; 
            border-bottom: 1px solid rgba(30, 41, 59, 0.8); 
            cursor: pointer; 
            font-size: 0.8rem; 
            border-radius: 4px;
        }

        .lobby-item:hover { background: rgba(250, 204, 21, 0.15); color: var(--accent-gold); }

        #game-view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; position: relative; padding-bottom: 5px; }
        
        #chat-container { position: relative; display: inline-block; }
        #chat-toggle-btn { background: #475569; border: none; color: #fff; font-size: 0.75rem; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        #chat-window { position: absolute; top: 45px; left: calc(50% - 120px); width: 240px; height: 160px; background: rgba(30,41,59,0.98); border: 1px solid #475569; border-radius: 8px; display: none; flex-direction: column; padding: 6px; z-index: 3000; font-size: 0.7rem; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .chat-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 3px; color: #38bdf8; font-weight: bold; }
        #chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
        .chat-input-row { display: flex; gap: 3px; }
        .chat-input-row input { flex: 1; padding: 3px; font-size: 0.7rem; }
        .chat-input-row button { padding: 3px 6px; font-size: 0.7rem; }

        .table-oval { position: relative; width: 620px; max-width: 96vw; height: 260px; background: radial-gradient(circle, #065f46 0%, #044e36 100%); border: 6px solid #78350f; border-radius: 140px; margin: auto; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 25px rgba(0,0,0,0.6); flex-shrink: 0; }
        
        .pots-container { position: absolute; top: 6px; display: flex; gap: 6px; align-items: center; z-index: 10; }
        .pot-total-display { font-size: 0.8rem; font-weight: bold; color: var(--accent-gold); background: rgba(15,23,42,0.85); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); }

        .seat { position: absolute; background: rgba(15, 23, 42, 0.9); border: 2px solid #475569; padding: 3px 6px; border-radius: 6px; font-size: 0.65rem; text-align: center; width: 110px; z-index: 5; display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; }
        .seat:hover { border-color: var(--accent-gold); }
        
        .seat-0 { bottom: -5px; left: calc(50% - 55px); }
        .seat-1 { bottom: 25px; left: 6px; }
        .seat-2 { top: 25px; left: 8px; }
        .seat-3 { top: -10px; left: calc(50% - 55px); }
        .seat-4 { top: 25px; right: 8px; }
        .seat-5 { bottom: 25px; right: 6px; }
        .seat-cards { display: flex; gap: 1px; justify-content: center; margin-top: 1px; }
        .mini-card { width: 18px; height: 26px; background: #fff; font-size: 0.45rem; font-weight: bold; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #cbd5e1; }
        .red-suit { color: #dc2626; }
        .black-suit { color: #0f172a; }

        .deck-center { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .card-slot { width: 48px; height: 70px; background: #fff; color: #000; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; cursor: pointer; border: 2px solid #cbd5e1; position: relative; }
        .card-slot.back { background: #1e3a8a; color: #fff; }

        .my-hand-area { background: rgba(4, 78, 54, 0.9); padding: 8px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; max-width: 450px; border: 1px solid var(--border-color); flex-shrink: 0; z-index: 100; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .cards-flex { display: flex !important; gap: 6px; min-height: 70px; align-items: center; justify-content: center; }
        .my-card { width: 50px; height: 72px; background: #fff; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; cursor: pointer; border: 2px solid #cbd5e1; box-shadow: 0 3px 5px rgba(0,0,0,0.3); }

        .bottom-action-bar { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; align-items: center; }
        
        #turn-banner { background: rgba(4, 78, 54, 0.9); border: 1px solid var(--accent-gold); padding: 3px 10px; border-radius: 16px; font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; flex-shrink: 0; }
        
        #knock-alert-modal { 
            position: absolute; 
            top: 40px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.96); 
            border: 2px solid #ef4444; 
            color: var(--accent-gold); 
            padding: 6px 18px; 
            border-radius: 20px; 
            font-weight: 900; 
            font-size: 0.85rem; 
            box-shadow: 0 4px 18px rgba(239, 68, 68, 0.6); 
            display: none; 
            z-index: 250; 
            pointer-events: none;
        }

        #center-notification-banner { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(4, 78, 54, 0.98); 
            border: 3px solid var(--accent-gold); 
            color: var(--text-main); 
            padding: 12px 28px; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 1.15rem; 
            text-align: center; 
            z-index: 4000; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); 
            display: none; 
            pointer-events: none; 
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
        .modal-content { background: var(--panel-bg); backdrop-filter: blur(16px); padding: 16px; border-radius: 12px; width: 95%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content h3 { color: var(--accent-gold); font-size: 1.1rem; }
    </style>
</head>
<body>

    <input type="checkbox" switch id="ios-haptic-trigger" style="position: absolute; opacity: 0; pointer-events: none; z-index: -9999;" />

    <div class="bg-card" style="top: 10%; left: 5%;">A♠</div>
    <div class="bg-card" style="top: 75%; left: 12%;">10♥</div>
    <div class="bg-card" style="top: 20%; right: 8%;">K♦</div>

    <header>
        <div class="logo">31!</div>
        <div class="top-menu-btns">
            <button class="secondary" onclick="openLedgerModal()">Ledger</button>
            <div class="vc-control-group" id="vc-group-container">
                <span id="vc-led" class="led-indicator"></span>
                <button class="secondary" id="vc-main-btn" onclick="toggleLiveKitMic()" style="padding: 3px 8px; font-size: 0.7rem;">🎙️ Voice: Off</button>
            </div>
            <div id="chat-container">
                <button id="chat-toggle-btn" onclick="toggleChatWindow()">💬 Chat</button>
            </div>
            <button class="danger" id="end-game-btn" style="display:none;" onclick="proposeEndGame()">End</button>
            <button class="danger" id="leave-lobby-btn" style="display:none;" onclick="leaveLobby()">Leave</button>
        </div>
        <div id="chat-window">
            <div class="chat-header-row">
                <span>Chat Room</span>
                <button class="secondary" style="padding: 2px 5px; font-size: 0.65rem;" onclick="toggleChatWindow()">➖</button>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </header>

    <main>
        <div id="main-menu">
            <h2>Lobby Menu</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username-input" oninput="saveInputs()">
            </div>
            <div class="input-group">
                <label>Lobby Name</label>
                <input type="text" id="lobby-name-input" oninput="saveInputs()">
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button onclick="createLobby()" style="flex:1;">Create Lobby</button>
                <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size:0.75rem;">
                    <input type="checkbox" id="private-lobby-checkbox"> Private
                </label>
            </div>

            <div class="input-group">
                <label>Join Code</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="lobby-code-input" placeholder="CODE" style="flex:1;">
                    <button onclick="joinLobby()">Join</button>
                </div>
            </div>

            <div class="input-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Public Lobbies</label>
                    <button class="secondary" style="padding: 2px 5px; font-size: 0.7rem;" onclick="refreshLobbies()">Refresh</button>
                </div>
                <div class="lobby-list-container" id="lobby-list">
                    <div style="text-align:center; color:#64748b; padding:6px;">No lobbies found</div>
                </div>
            </div>
        </div>

        <div id="game-view">
            <div id="center-notification-banner">NOTIFICATION</div>

            <div style="display:flex; justify-content:space-between; width:100%; max-width:600px; align-items:center; flex-shrink:0;">
                <span id="room-title-display" style="font-size:0.75rem; font-weight:bold; color:var(--accent-gold);">Lobby</span>
                <div id="turn-banner">Turn: Waiting...</div>
            </div>

            <div id="knock-alert-modal">🔔 Knock Alert</div>

            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <button class="secondary" onclick="addBot()">+ Bot</button>
                <button class="secondary" onclick="removeBot()">- Bot</button>
            </div>
            
            <div class="table-oval" id="table-oval-container">
                <div class="pots-container">
                    <div class="pot-total-display" id="pot-total-banner">Pot: $0</div>
                </div>
                <div class="deck-center" id="table-deck-center">
                    <div class="card-slot back" onclick="drawCard('deck')">DECK</div>
                    <div class="card-slot" id="discard-slot" onclick="drawCard('discard')">--</div>
                </div>
            </div>

            <div class="my-hand-area" id="my-hand-control-area">
                <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.8rem; color: var(--text-muted);">
                    <span id="my-hand-title">My Hand (Score: <strong style="font-size: 1rem; color: var(--accent-gold);" id="my-score-display">0</strong>)</span>
                </div>
                <div class="cards-flex" id="my-cards-container"></div>
                <div class="bottom-action-bar" id="my-action-buttons">
                    <button id="ready-btn" onclick="toggleReady()">Ready Up</button>
                    <button onclick="knockRound()" id="knock-btn" class="secondary" disabled>Knock</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Ledger Balances Modal -->
    <div id="ledger-modal" class="modal">
        <div class="modal-content" style="max-width:340px;">
            <h3>Ledger & Balances</h3>
            <div id="ledger-content" style="font-size:0.8rem; color:var(--text-muted); text-align:left; max-height:220px; overflow-y:auto; padding:4px;">No wagers recorded yet.</div>
            <button onclick="saveLedgerScreenshot()" style="background:#10b981; margin-top:6px;">📸 Save Snapshot to Device</button>
            <button class="secondary" onclick="toggleModal('ledger-modal')">Close</button>
        </div>
    </div>

    <!-- Android & Cross-Platform Ledger Snapshot Fail-Safe Modal -->
    <div id="screenshot-modal" class="modal" style="z-index: 6000;">
        <div class="modal-content" style="max-width: 380px; user-select: auto; -webkit-user-select: auto;">
            <h3 style="color: var(--accent-gold);">📸 Ledger Snapshot</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px;">
                Tap <b>Download</b> or <b>Share</b> below. You can also touch and hold the preview image to save it.
            </p>
            
            <div style="max-height: 48vh; overflow-y: auto; border-radius: 6px; border: 1px solid rgba(250,204,21,0.3); background: #022c22; padding: 4px; user-select: auto; -webkit-user-select: auto;">
                <img id="screenshot-preview-img" 
                     alt="Ledger Snapshot" 
                     style="width: 100%; height: auto; display: block; border-radius: 4px; pointer-events: auto !important; user-select: auto !important; -webkit-user-select: auto !important; -webkit-touch-callout: default !important;" />
            </div>

            <div id="screenshot-status-text" style="font-size: 0.75rem; font-weight: bold; color: var(--accent-gold); min-height: 18px; margin-top: 4px;"></div>

            <div style="display: flex; gap: 6px; margin-top: 6px;">
                <button id="screenshot-share-btn" type="button" style="flex: 1; background: #10b981; padding: 8px;">📤 Share / Save</button>
                <button id="screenshot-download-btn" type="button" style="flex: 1; background: #2563eb; padding: 8px;">💾 Download</button>
            </div>
            <button class="secondary" type="button" onclick="closeScreenshotModal()" style="margin-top: 6px; padding: 8px;">Close</button>
        </div>
    </div>

    <script>
        let ws = null;
        let isConnected = false;
        let pendingQueue = [];
        let clientState = { username: 'Player1', isReady: false, playersList: [], gameState: 'lobby', sideBetLedger: {}, mainGameLedger: {} };
        let currentJoinedCode = null;
        let livekitRoom = null;
        let isLiveKitConnected = false;
        let isLiveKitMuted = true;

        // Synchronous Base64 to Blob Converter
        function dataURLToBlobSync(dataURL) {
            const parts = dataURL.split(',');
            const mime = parts[0].match(/:(.*?);/)[1];
            const binary = atob(parts[1]);
            const len = binary.length;
            const u8arr = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                u8arr[i] = binary.charCodeAt(i);
            }
            return new Blob([u8arr], { type: mime });
        }

        function closeScreenshotModal() {
            const modal = document.getElementById('screenshot-modal');
            if (modal) modal.style.display = 'none';
        }

        function setModalStatus(msg) {
            const el = document.getElementById('screenshot-status-text');
            if (el) el.innerText = msg;
        }

        // Android-Proof Ledger Snapshot Pipeline
        async function saveLedgerScreenshot() {
            const ledgerModal = document.getElementById('ledger-modal');
            if (ledgerModal) ledgerModal.style.display = 'none';

            const myName = (document.getElementById('username-input').value.trim() || clientState.username || 'Player').trim();
            const now = new Date();
            const dateStr = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const fileName = `31-ledger-${dateStr}.png`;
            const readableDate = now.toLocaleString();

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 740;

            // Background & Border
            ctx.fillStyle = '#065f46';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 6;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Header Banner
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 24px system-ui, sans-serif';
            ctx.fillText("31! Game Ledger Snapshot", 30, 50);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '14px system-ui, sans-serif';
            ctx.fillText(`Player: ${myName}  |  Captured: ${readableDate}`, 30, 80);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(30, 95);
            ctx.lineTo(570, 95);
            ctx.stroke();

            const sideCalc = calculatePairwiseNet(clientState.sideBetLedger || {}, myName, clientState.playersList || []);
            const mainCalc = calculatePairwiseNet(clientState.mainGameLedger || {}, myName, clientState.playersList || []);
            const grandTotal = sideCalc.totalNet + mainCalc.totalNet;

            ctx.fillStyle = grandTotal >= 0 ? '#34d399' : '#f87171';
            ctx.font = 'bold 20px system-ui, sans-serif';
            ctx.fillText(`Total Net Balance: $${grandTotal.toFixed(2)}`, 30, 130);

            let y = 170;
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 16px system-ui, sans-serif';
            ctx.fillText("🤝 Side Bets", 30, y);
            y += 25;

            ctx.font = '15px system-ui, sans-serif';
            const sideEntries = Object.entries(sideCalc.records);
            if (sideEntries.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.fillText("No active side bet balances.", 45, y);
                y += 25;
            } else {
                for (let [user, netAmt] of sideEntries) {
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillText(`• ${user}: `, 45, y);
                    ctx.fillStyle = netAmt > 0 ? '#34d399' : '#f87171';
                    ctx.fillText(netAmt > 0 ? `owes you $${Math.abs(netAmt).toFixed(2)}` : `you owe $${Math.abs(netAmt).toFixed(2)}`, 160, y);
                    y += 25;
                }
            }

            y += 15;
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 16px system-ui, sans-serif';
            ctx.fillText("🎮 Main Game Pot Ledger", 30, y);
            y += 25;

            ctx.font = '15px system-ui, sans-serif';
            const mainEntries = Object.entries(mainCalc.records);
            if (mainEntries.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.fillText("No main game balances recorded.", 45, y);
            } else {
                for (let [user, netAmt] of mainEntries) {
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillText(`• ${user}: `, 45, y);
                    ctx.fillStyle = netAmt > 0 ? '#34d399' : '#f87171';
                    ctx.fillText(netAmt > 0 ? `owes you $${Math.abs(netAmt).toFixed(2)}` : `you owe $${Math.abs(netAmt).toFixed(2)}`, 160, y);
                    y += 25;
                }
            }

            const dataUrl = canvas.toDataURL('image/png');
            const blob = dataURLToBlobSync(dataUrl);
            const blobUrl = URL.createObjectURL(blob);
            const file = new File([blob], fileName, { type: 'image/png' });

            showScreenshotModal(dataUrl, blobUrl, file, fileName);
        }

        function showScreenshotModal(dataUrl, blobUrl, file, fileName) {
            const modal = document.getElementById('screenshot-modal');
            const img = document.getElementById('screenshot-preview-img');
            const shareBtn = document.getElementById('screenshot-share-btn');
            const dlBtn = document.getElementById('screenshot-download-btn');
            if (!modal || !img) return;

            img.src = dataUrl;
            setModalStatus("");

            shareBtn.onclick = async () => {
                setModalStatus("Opening share sheet...");
                if (window.Capacitor?.Plugins?.Share) {
                    try {
                        await window.Capacitor.Plugins.Share.share({
                            title: '31! Game Ledger',
                            url: dataUrl,
                            dialogTitle: 'Save or Share Ledger'
                        });
                        setModalStatus("Share sheet opened.");
                        return;
                    } catch (e) {}
                }

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: '31! Game Ledger' });
                        setModalStatus("Snapshot shared!");
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            setModalStatus("");
                            return;
                        }
                    }
                }
                setModalStatus("Share unavailable. Use Download or hold the image.");
            };

            dlBtn.onclick = () => {
                setModalStatus("Starting download...");
                try {
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setModalStatus("File download sent to device!");
                } catch (err) {
                    window.open(blobUrl, '_blank');
                    setModalStatus("Opened image in viewer. Save from menu.");
                }
            };

            modal.style.display = 'flex';
        }

        function calculatePairwiseNet(ledgerData, myName, allUsers) {
            let totalNet = 0;
            let records = {};
            let ledgerKeys = new Set([...Object.keys(ledgerData || {}), ...(allUsers || [])]);
            for (let debtorKey in (ledgerData || {})) {
                ledgerKeys.add(debtorKey);
                if (ledgerData[debtorKey] && typeof ledgerData[debtorKey] === 'object') {
                    for (let creditorKey in ledgerData[debtorKey]) ledgerKeys.add(creditorKey);
                }
            }
            ledgerKeys.forEach(otherUser => {
                let cleanOther = (otherUser || '').trim();
                let cleanMe = (myName || '').trim();
                if (cleanOther.toLowerCase() === cleanMe.toLowerCase()) return;
                let theyOweMe = (ledgerData?.[cleanOther]?.[cleanMe]) || 0;
                let iOweThem = (ledgerData?.[cleanMe]?.[cleanOther]) || 0;
                let net = theyOweMe - iOweThem;
                if (net !== 0) { records[cleanOther] = net; totalNet += net; }
            });
            return { totalNet, records };
        }

        function openLedgerModal() {
            let ledgerDiv = document.getElementById('ledger-content');
            let myName = (document.getElementById('username-input').value.trim() || clientState.username).trim();
            let sideCalc = calculatePairwiseNet(clientState.sideBetLedger || {}, myName, clientState.playersList || []);
            let mainCalc = calculatePairwiseNet(clientState.mainGameLedger || {}, myName, clientState.playersList || []);
            let grandTotal = sideCalc.totalNet + mainCalc.totalNet;
            let html = `<div style="font-weight:bold; color:${grandTotal >= 0 ? '#34d399' : '#f87171'}; margin-bottom:6px;">Total Net: $${grandTotal.toFixed(2)}</div>`;
            ledgerDiv.innerHTML = html;
            toggleModal('ledger-modal');
        }

        function toggleModal(id) {
            let m = document.getElementById(id);
            if (m) m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function showCenterNotification(msg) {
            let banner = document.getElementById('center-notification-banner');
            if (!banner) return;
            banner.innerText = msg;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 2500);
        }

        // LiveKit Audio Integration
        async function connectToLiveKit(host, token) {
            if (!window.LivekitClient) return;
            try {
                if (livekitRoom) await livekitRoom.disconnect();
                livekitRoom = new LivekitClient.Room({ adaptiveStream: true });
                livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) {
                        const el = track.attach();
                        document.body.appendChild(el);
                    }
                });
                await livekitRoom.connect(host, token);
                isLiveKitConnected = true;
                await livekitRoom.localParticipant.setMicrophoneEnabled(false);
                isLiveKitMuted = true;
                updateLiveKitUI();
            } catch (e) {
                console.error("LiveKit connection failure:", e);
            }
        }

        async function toggleLiveKitMic() {
            if (!livekitRoom || !isLiveKitConnected) return;
            isLiveKitMuted = !isLiveKitMuted;
            try {
                await livekitRoom.localParticipant.setMicrophoneEnabled(!isLiveKitMuted);
            } catch (e) {}
            updateLiveKitUI();
        }

        function updateLiveKitUI() {
            let btn = document.getElementById('vc-main-btn');
            let led = document.getElementById('vc-led');
            if (btn) btn.innerText = isLiveKitMuted ? '🎙️ Voice: Off' : '🎙️ Voice: On';
            if (led) {
                if (isLiveKitMuted) led.classList.remove('active');
                else led.classList.add('active');
            }
        }

        // WebSocket Handlers
        function connectSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host);

            ws.onopen = () => {
                isConnected = true;
                while (pendingQueue.length > 0) ws.send(JSON.stringify(pendingQueue.shift()));
            };

            ws.onmessage = (event) => {
                let data = JSON.parse(event.data);
                if (data.type === 'LOBBY_LIST') renderLobbyList(data.lobbies);
                else if (data.type === 'LOBBY_JOINED' || data.type === 'GAME_STATE_UPDATE') {
                    if (data.lobby && data.lobby.code) currentJoinedCode = data.lobby.code;
                    updateUIFromLobby(data.lobby);
                    if (data.livekitHost && data.livekitToken) {
                        connectToLiveKit(data.livekitHost, data.livekitToken);
                    }
                } else if (data.type === 'CHAT_MESSAGE') {
                    let box = document.getElementById('chat-messages');
                    if (box) {
                        box.innerHTML += `<div><b>${data.username}:</b> ${data.message}</div>`;
                        box.scrollTop = box.scrollHeight;
                    }
                } else if (data.type === 'LEFT_LOBBY') {
                    currentJoinedCode = null;
                    if (livekitRoom) livekitRoom.disconnect();
                    document.getElementById('game-view').style.display = 'none';
                    document.getElementById('main-menu').style.display = 'flex';
                    document.getElementById('end-game-btn').style.display = 'none';
                    document.getElementById('leave-lobby-btn').style.display = 'none';
                    refreshLobbies();
                } else if (data.type === 'ERROR') alert(data.message);
            };

            ws.onclose = () => {
                isConnected = false;
                setTimeout(() => { connectSocket(); }, 3000);
            };
        }

        function initSocketAndSend(payload) {
            saveInputs();
            clientState.username = document.getElementById('username-input').value.trim() || 'Player1';
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
            else {
                pendingQueue.push(payload);
                connectSocket();
            }
        }

        function refreshLobbies() { initSocketAndSend({ type: 'REFRESH_LOBBIES' }); }

        function renderLobbyList(lobbies) {
            let container = document.getElementById('lobby-list');
            if (!container) return;
            if (!lobbies || lobbies.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#64748b; padding:6px;">No lobbies found</div>';
                return;
            }
            container.innerHTML = lobbies.map(l => `<div class="lobby-item" onclick="joinLobbyCode('${l.code}')"><span>${l.name} (${l.count}/6)</span><span style="color:#38bdf8;">Join</span></div>`).join('');
        }

        function createLobby() {
            let username = document.getElementById('username-input').value.trim() || 'Player1';
            let lobbyName = document.getElementById('lobby-name-input').value.trim() || 'My Table';
            let isPrivate = document.getElementById('private-lobby-checkbox').checked;
            initSocketAndSend({ type: 'CREATE_LOBBY', username, lobbyName, isPrivate });
        }

        function joinLobby() {
            let code = document.getElementById('lobby-code-input').value.toUpperCase();
            if (code) joinLobbyCode(code);
        }

        function joinLobbyCode(code) {
            currentJoinedCode = code;
            initSocketAndSend({ type: 'JOIN_LOBBY', code, username: document.getElementById('username-input').value.trim() || 'Player1' });
        }

        function addBot() { initSocketAndSend({ type: 'ADD_BOT' }); }
        function removeBot() { initSocketAndSend({ type: 'REMOVE_BOT' }); }
        function toggleReady() { initSocketAndSend({ type: 'SET_READY', ready: true }); }
        function drawCard(source) { initSocketAndSend({ type: 'DRAW_CARD', source }); }
        function discardCard(cardIndex) { initSocketAndSend({ type: 'DISCARD_CARD', cardIndex }); }
        function knockRound() { initSocketAndSend({ type: 'KNOCK' }); }
        function leaveLobby() { initSocketAndSend({ type: 'LEAVE_LOBBY' }); }

        function updateUIFromLobby(lobby) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('end-game-btn').style.display = 'inline-block';
            document.getElementById('leave-lobby-btn').style.display = 'inline-block';
            document.getElementById('vc-group-container').style.display = 'inline-flex';
            document.getElementById('room-title-display').innerText = `${lobby.name} [${lobby.code}]`;

            clientState.sideBetLedger = lobby.sideBetLedger || {};
            clientState.mainGameLedger = lobby.mainGameLedger || {};
            clientState.playersList = (lobby.players || []).map(p => p.username);

            document.getElementById('pot-total-banner').innerText = `Pot: $${lobby.potTotal || 0}`;
            document.getElementById('turn-banner').innerText = `Turn: ${lobby.currentTurnUser || 'Waiting'}`;

            let discardSlot = document.getElementById('discard-slot');
            if (lobby.discardTop) {
                discardSlot.className = `card-slot ${['♥', '♦'].includes(lobby.discardTop.suit) ? 'red-suit' : 'black-suit'}`;
                discardSlot.innerText = `${lobby.discardTop.val}${lobby.discardTop.suit}`;
            } else {
                discardSlot.className = 'card-slot';
                discardSlot.innerText = '--';
            }

            // Render Seats
            let oval = document.getElementById('table-oval-container');
            oval.querySelectorAll('.seat').forEach(s => s.remove());
            (lobby.players || []).forEach(p => {
                let seatDiv = document.createElement('div');
                seatDiv.className = `seat seat-${p.seat}`;
                seatDiv.innerHTML = `
                    <div><b>${p.username}</b> ${p.isMuted ? '🔇' : '🎙️'}</div>
                    <div style="color:var(--accent-gold);">Lives: ${p.lives}</div>
                `;
                oval.appendChild(seatDiv);
            });

            // Render My Hand
            let myPlayer = (lobby.players || []).find(p => p.username === clientState.username);
            let cardsContainer = document.getElementById('my-cards-container');
            cardsContainer.innerHTML = '';
            if (myPlayer && myPlayer.cards) {
                document.getElementById('my-score-display').innerText = myPlayer.score || 0;
                myPlayer.cards.forEach((c, idx) => {
                    let cardEl = document.createElement('div');
                    cardEl.className = `my-card ${['♥', '♦'].includes(c.suit) ? 'red-suit' : 'black-suit'}`;
                    cardEl.innerText = `${c.val}${c.suit}`;
                    if (myPlayer.cards.length === 4) {
                        cardEl.onclick = () => discardCard(idx);
                    }
                    cardsContainer.appendChild(cardEl);
                });
            }

            let knockBtn = document.getElementById('knock-btn');
            knockBtn.disabled = !(lobby.canKnock && lobby.currentTurnUser === clientState.username && !lobby.hasKnockedUser);
        }

        function saveInputs() {
            localStorage.setItem('saved_username', document.getElementById('username-input').value);
            localStorage.setItem('saved_lobby_name', document.getElementById('lobby-name-input').value);
        }

        function toggleChatWindow() {
            let win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendChatMessage() {
            let input = document.getElementById('chat-input');
            let text = input.value.trim();
            if (text) {
                initSocketAndSend({ type: 'CHAT_MESSAGE', message: text });
                input.value = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('saved_username')) document.getElementById('username-input').value = localStorage.getItem('saved_username');
            if (localStorage.getItem('saved_lobby_name')) document.getElementById('lobby-name-input').value = localStorage.getItem('saved_lobby_name');
            connectSocket();
            refreshLobbies();
        });
    </script>
</body>
</html>
