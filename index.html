<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>31! Card Game</title>
    <!-- Official LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at center, #065f46 0%, #044e36 60%, #022c22 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #facc15;
            z-index: 100;
        }
        .header-title { font-weight: 900; font-size: 1.3rem; color: #facc15; letter-spacing: 1px; }
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn:hover { background: #334155; }
        .btn-gold { background: #eab308; color: #000; border-color: #facc15; }
        .btn-gold:hover { background: #facc15; }
        .btn-danger { background: #dc2626; border-color: #ef4444; }
        .btn-danger:hover { background: #b91c1c; }
        
        /* Voice indicator LED */
        .vc-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444; /* red when muted/off */
            display: inline-block;
            box-shadow: 0 0 4px #ef4444;
            transition: all 0.2s ease;
        }
        .vc-led.active {
            background-color: #22c55e; /* green when active */
            box-shadow: 0 0 8px #22c55e;
        }

        /* Main Menu View */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            gap: 16px;
        }
        .menu-card {
            background: rgba(15, 23, 42, 0.9);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .input-field {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        /* Table Area */
        #game-view {
            display: none;
            flex: 1;
            flex-direction: column;
            position: relative;
            padding: 10px;
            overflow: hidden;
        }
        .table-oval {
            flex: 1;
            border: 8px solid #3f2e18;
            border-radius: 120px;
            background: radial-gradient(ellipse at center, #047857 0%, #064e3b 100%);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            min-height: 480px;
        }

        /* Discard Pickup Modal (Top-Left) */
        #discard-pickup-topleft-modal {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #facc15;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #facc15;
            display: none;
            z-index: 50;
        }

        /* Center Board */
        .table-center {
            display: flex;
            align-items: center;
            gap: 24px;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .pile {
            width: 70px;
            height: 98px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #fff;
        }
        .deck-pile { background: repeating-linear-gradient(45deg, #1e3a8a, #1e3a8a 10px, #172554 10px, #172554 20deg); color: #fff; }
        .discard-pile { background: #fff; color: #000; }

        /* Card Styles */
        .card {
            width: 66px;
            height: 94px;
            background: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card.red { color: #dc2626; }
        .card.black { color: #0f172a; }

        /* Player Seats */
        .seats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            padding: 10px;
        }
        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            pointer-events: auto;
        }

        /* Player Hands & Bottom Dock */
        .bottom-dock {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            z-index: 20;
        }
        .hand-container { display: flex; gap: 8px; align-items: center; }

        /* Draw Pool Grid */
        #draw-pool-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #facc15;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 60;
            max-width: 90vw;
        }
        .pool-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }

        /* Floating Chat Window */
        #chat-window {
            position: fixed;
            bottom: 70px;
            right: 16px;
            width: 280px;
            height: 340px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #facc15;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            z-index: 150;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        #chat-messages { flex: 1; padding: 8px; overflow-y: auto; font-size: 0.85rem; }
        .chat-input-row { display: flex; border-top: 1px solid #334155; }
        #chat-input { flex: 1; background: transparent; border: none; color: #fff; padding: 8px; outline: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">31! CASINO</div>
        <div class="header-controls">
            <!-- Consolidated Voice Toggle & LED Indicator -->
            <button id="vc-main-btn" class="btn" onclick="toggleVoiceOnOff()">
                <span id="vc-led" class="vc-led"></span> 🎙️ Voice: Off
            </button>
            <button id="chat-toggle-btn" class="btn" onclick="toggleChatWindow()">💬 Chat</button>
            <button class="btn btn-gold" onclick="alert('Rules: Form a 3-card hand in one suit. Face cards=10, Aces=11. 3 identical cards = 30.5 pts. Lowest loses a life!')">📖 Rules</button>
            <button id="leave-btn" class="btn btn-danger" style="display:none;" onclick="leaveCurrentLobby()">Exit</button>
        </div>
    </header>

    <!-- Main Menu View -->
    <div id="main-menu">
        <div class="menu-card">
            <h2>Player Setup</h2>
            <input type="text" id="username-input" class="input-field" placeholder="Enter Username..." maxlength="12">
            <button class="btn btn-gold" onclick="createLobby()">Create Match</button>
            <hr style="border-color:#334155;">
            <input type="text" id="join-code-input" class="input-field" placeholder="Enter 6-Letter Lobby Code..." maxlength="6" style="text-transform:uppercase;">
            <button class="btn" onclick="joinLobbyByCode()">Join Lobby</button>
        </div>
    </div>

    <!-- Active Table View -->
    <div id="game-view">
        <div class="table-oval">
            <!-- Discard Pickup Info Banner -->
            <div id="discard-pickup-topleft-modal"></div>

            <!-- Seats Grid -->
            <div class="seats-container" id="seats-container"></div>

            <!-- Central Draw & Discard Piles -->
            <div class="table-center">
                <div class="pile deck-pile" onclick="drawFromDeck()">DECK</div>
                <div class="pile discard-pile" id="discard-pile-view" onclick="drawFromDiscard()">EMPTY</div>
            </div>

            <!-- Dealer / Tie Breaker Pool Grid -->
            <div id="draw-pool-container">
                <h3 id="pool-title" style="color:#facc15;">Select a Card</h3>
                <div class="pool-grid" id="pool-grid"></div>
            </div>

            <!-- Phase message banner -->
            <div id="phase-banner" style="position:absolute; top:20px; font-weight:bold; color:#facc15; font-size:1.1rem; text-shadow:0 2px 4px #000;"></div>
        </div>

        <!-- Bottom Player Hand & Control Dock -->
        <div class="bottom-dock">
            <div class="hand-container" id="my-cards-container"></div>
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="font-weight:bold; font-size:1.1rem;">Score: <span id="my-score" style="color:#facc15;">0</span></div>
                <button id="ready-btn" class="btn btn-gold" onclick="toggleReady()">Ready Up</button>
                <button id="knock-btn" class="btn btn-danger" onclick="callKnock()" style="display:none;">KNOCK!</button>
                <button id="next-hand-btn" class="btn btn-gold" onclick="readyNextHand()" style="display:none;">Next Hand</button>
            </div>
        </div>
    </div>

    <!-- Floating In-Game Chat Window -->
    <div id="chat-window">
        <div style="padding:6px 10px; background:#1e293b; font-weight:bold; font-size:0.8rem; display:flex; justify-content:space-between;">
            <span>Table Chat</span>
            <span style="cursor:pointer;" onclick="toggleChatWindow()">✕</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="btn btn-gold" style="border-radius:0;" onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <script>
        // WebSocket and State
        let ws = null;
        let currentLobbyCode = null;
        let myUsername = 'Player';
        let latestLobbySnapshot = null;

        // LiveKit SFU Client State
        let livekitRoom = null;
        let isLiveKitConnected = false;
        let isVoiceChatActive = false; // Source of truth: false = Muted, true = Active
        let isConnectingVoice = false;
        let latestLiveKitHost = null;
        let latestLiveKitToken = null;

        function getLiveKitSDK() {
            return window.LivekitClient || window.LiveKitClient || null;
        }

        // Connect to WebSocket Server
        function initWebSocket() {
            const host = window.location.host;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${host}`);

            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch(e) { return; }

                switch(data.type) {
                    case 'LOBBY_JOINED':
                    case 'GAME_STATE_UPDATE':
                        if (data.lobby && data.lobby.code) currentLobbyCode = data.lobby.code;
                        latestLobbySnapshot = data.lobby;
                        renderLobby(data.lobby);

                        // Capture and initiate LiveKit voice automatically in MUTED state[span_10](start_span)[span_10](end_span)
                        const host = data.livekitHost || latestLiveKitHost;
                        const token = data.livekitToken || data.token || latestLiveKitToken;
                        if (host && token) {
                            latestLiveKitHost = host;
                            latestLiveKitToken = token;
                            if (!isLiveKitConnected && !isConnectingVoice) {
                                connectToLiveKit(host, token);
                            }
                        }
                        break;

                    case 'LIVEKIT_TOKEN':
                        const lkHost = data.livekitHost || latestLiveKitHost;
                        const lkToken = data.livekitToken || data.token;
                        if (lkHost && lkToken) {
                            latestLiveKitHost = lkHost;
                            latestLiveKitToken = lkToken;
                            connectToLiveKit(lkHost, lkToken);
                        }
                        break;

                    case 'CHAT_MESSAGE':
                        appendChatMessage(data.username, data.message);
                        break;

                    case 'LEFT_LOBBY':
                        disconnectLiveKit();
                        resetUI();
                        break;

                    case 'ERROR':
                        alert(data.message);
                        break;
                }
            };

            ws.onclose = () => {
                setTimeout(initWebSocket, 2000);
            };
        }

        function sendWS(payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            }
        }

        // LiveKit Voice Connection Logic[span_11](start_span)[span_11](end_span)
        async function connectToLiveKit(host, token) {
            const LK = getLiveKitSDK();
            if (!LK) {
                console.error("LiveKit client SDK not loaded from CDN.");
                return;
            }

            if (isConnectingVoice) return;
            isConnectingVoice = true;

            try {
                if (livekitRoom) {
                    try { await livekitRoom.disconnect(); } catch (e) {}
                    livekitRoom = null;
                }

                livekitRoom = new LK.Room({
                    adaptiveStream: true,
                    dynacast: true,
                    audioCaptureDefaults: {
                        autoGainControl: true,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                // Attach incoming remote audio streams
                livekitRoom.on(LK.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LK.Track.Kind.Audio || track.kind === 'audio') {
                        const audioElem = track.attach();
                        audioElem.autoplay = true;
                        audioElem.playsInline = true;
                        audioElem.setAttribute('playsinline', '');
                        audioElem.setAttribute('webkit-playsinline', '');
                        document.body.appendChild(audioElem);
                    }
                });

                // Detach audio on participant leaving
                livekitRoom.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });

                livekitRoom.on(LK.RoomEvent.Disconnected, () => {
                    isLiveKitConnected = false;
                    isVoiceChatActive = false;
                    updateVoiceUI();
                });

                await livekitRoom.connect(host, token);
                isLiveKitConnected = true;

                // Auto-join lobby in MUTED state[span_12](start_span)[span_12](end_span)
                await livekitRoom.localParticipant.setMicrophoneEnabled(false);
                isVoiceChatActive = false;
                updateVoiceUI();
                sendWS({ type: 'UPDATE_VC_STATUS', inVC: true, isMuted: true });

                console.log("Connected to LiveKit SFU successfully in muted state!");
            } catch (err) {
                console.error("LiveKit connection error:", err);
            } finally {
                isConnectingVoice = false;
            }
        }

        // Consolidated Voice & Mute Toggle Handler
        async function toggleVoiceOnOff() {
            if (!livekitRoom || !isLiveKitConnected) {
                if (latestLiveKitHost && latestLiveKitToken) {
                    const btn = document.getElementById('vc-main-btn');
                    if (btn) btn.innerText = 'Connecting...';
                    await connectToLiveKit(latestLiveKitHost, latestLiveKitToken);
                } else {
                    sendWS({ type: 'REQUEST_LIVEKIT_TOKEN' });
                    return;
                }
            }

            if (!livekitRoom || !isLiveKitConnected) return;

            try {
                if (isVoiceChatActive) {
                    // MUTE MICROPHONE
                    await livekitRoom.localParticipant.setMicrophoneEnabled(false);
                    isVoiceChatActive = false;
                    updateVoiceUI();
                    sendWS({ type: 'UPDATE_VC_STATUS', inVC: true, isMuted: true });
                } else {
                    // UNMUTE MICROPHONE
                    await livekitRoom.startAudio();
                    await livekitRoom.localParticipant.setMicrophoneEnabled(true);
                    isVoiceChatActive = true;
                    updateVoiceUI();
                    sendWS({ type: 'UPDATE_VC_STATUS', inVC: true, isMuted: false });
                }
            } catch (err) {
                console.error("Microphone toggle error:", err);
                isVoiceChatActive = false;
                updateVoiceUI();
            }
        }

        // Alias for backwards compatibility
        const toggleLiveKitVoice = toggleVoiceOnOff;

        function updateVoiceUI() {
            const btn = document.getElementById('vc-main-btn');
            const led = document.getElementById('vc-led');
            if (btn) {
                btn.innerHTML = `<span id="vc-led" class="vc-led ${isVoiceChatActive ? 'active' : ''}"></span> ${isVoiceChatActive ? '🎙️ Voice: On' : '🎙️ Voice: Off'}`;
            }
        }

        async function disconnectLiveKit() {
            if (livekitRoom) {
                try { await livekitRoom.disconnect(); } catch (e) {}
                livekitRoom = null;
            }
            isLiveKitConnected = false;
            isVoiceChatActive = false;
            updateVoiceUI();
        }

        // Chat Handlers
        function toggleChatWindow() {
            const win = document.getElementById('chat-window');
            const isVisible = win.style.display === 'flex';
            win.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) {
                const btn = document.getElementById('chat-toggle-btn');
                btn.innerText = '💬 Chat';
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            sendWS({ type: 'CHAT_MESSAGE', message: text });
            input.value = '';
        }

        function appendChatMessage(user, msg) {
            const container = document.getElementById('chat-messages');
            const line = document.createElement('div');
            line.style.marginBottom = '4px';
            line.innerHTML = `<strong>${escapeHtml(user)}:</strong> ${escapeHtml(msg)}`;
            container.appendChild(line);
            container.scrollTop = container.scrollHeight;

            const win = document.getElementById('chat-window');
            if (win.style.display !== 'flex') {
                document.getElementById('chat-toggle-btn').innerText = '💬 Chat (*)';
            }
        }

        // Lobby Actions
        function createLobby() {
            const nameInput = document.getElementById('username-input');
            myUsername = nameInput.value.trim() || 'Host';
            sendWS({ type: 'CREATE_LOBBY', username: myUsername });
        }

        function joinLobbyByCode() {
            const nameInput = document.getElementById('username-input');
            const codeInput = document.getElementById('join-code-input');
            myUsername = nameInput.value.trim() || 'Player';
            const code = codeInput.value.trim().toUpperCase();
            if (code) sendWS({ type: 'JOIN_LOBBY', code, username: myUsername });
        }

        function leaveCurrentLobby() {
            sendWS({ type: 'LEAVE_LOBBY' });
        }

        function toggleReady() {
            const me = latestLobbySnapshot?.players?.find(p => p.username === myUsername);
            sendWS({ type: 'SET_READY', ready: !me?.ready });
        }

        function readyNextHand() {
            sendWS({ type: 'NEXT_HAND' });
        }

        function callKnock() {
            sendWS({ type: 'KNOCK' });
        }

        function drawFromDeck() {
            sendWS({ type: 'DRAW_DECK' });
        }

        function drawFromDiscard() {
            sendWS({ type: 'DRAW_DISCARD' });
        }

        function discardCard(idx) {
            sendWS({ type: 'DISCARD_CARD', cardIndex: idx });
        }

        function pickPoolCard(idx) {
            sendWS({ type: 'CHOOSE_POOL_CARD', cardIndex: idx });
        }

        // UI Rendering Logic
        function renderLobby(lobby) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('leave-btn').style.display = 'inline-flex';

            // Phase Message
            document.getElementById('phase-banner').innerText = lobby.phaseMessage || '';

            // Discard Pickup Banner
            const pickupModal = document.getElementById('discard-pickup-topleft-modal');
            if (lobby.lastDiscardPickup) {
                pickupModal.style.display = 'block';
                pickupModal.innerText = `Discard: ${lobby.lastDiscardPickup.username} drew ${lobby.lastDiscardPickup.card.val}${lobby.lastDiscardPickup.card.suit}`;
            } else {
                pickupModal.style.display = 'none';
            }

            // Central Discard Pile
            const discardView = document.getElementById('discard-pile-view');
            if (lobby.discardTop) {
                discardView.innerText = `${lobby.discardTop.val}${lobby.discardTop.suit}`;
                discardView.style.color = ['♥', '♦'].includes(lobby.discardTop.suit) ? '#dc2626' : '#0f172a';
            } else {
                discardView.innerText = 'EMPTY';
                discardView.style.color = '#000';
            }

            // Seats Rendering
            const seatsBox = document.getElementById('seats-container');
            seatsBox.innerHTML = '';
            lobby.players.forEach(p => {
                const seatDiv = document.createElement('div');
                seatDiv.className = 'seat';
                seatDiv.innerHTML = `
                    <div style="background:#0f172a; border:1px solid #334155; padding:4px 8px; border-radius:6px; color:#fff;">
                        ${escapeHtml(p.username)} (${p.lives} ❤️) ${p.ready ? '✅' : ''}
                    </div>
                `;
                seatsBox.appendChild(seatDiv);
            });

            // My Cards & Score
            const myPlayer = lobby.players.find(p => p.username === myUsername);
            const handContainer = document.getElementById('my-cards-container');
            handContainer.innerHTML = '';

            if (myPlayer && myPlayer.cards) {
                myPlayer.cards.forEach((card, idx) => {
                    const cardDiv = document.createElement('div');
                    const isRed = ['♥', '♦'].includes(card.suit);
                    cardDiv.className = `card ${isRed ? 'red' : 'black'}`;
                    cardDiv.innerHTML = `
                        <div style="text-align:left;">${card.val}<br>${card.suit}</div>
                        <div style="text-align:right;">${card.val}</div>
                    `;
                    // Click to discard if 4 cards in hand
                    if (myPlayer.cards.length === 4) {
                        cardDiv.onclick = () => discardCard(idx);
                    }
                    handContainer.appendChild(cardDiv);
                });
                document.getElementById('my-score').innerText = calculateLocalScore(myPlayer.cards);
            }

            // Action Buttons
            const readyBtn = document.getElementById('ready-btn');
            const knockBtn = document.getElementById('knock-btn');
            const nextHandBtn = document.getElementById('next-hand-btn');

            readyBtn.style.display = lobby.gameState === 'lobby' ? 'inline-flex' : 'none';
            readyBtn.innerText = myPlayer?.ready ? 'Ready ✅' : 'Ready Up';

            const isMyTurn = lobby.currentTurnUser === myUsername;
            knockBtn.style.display = (lobby.gameState === 'playing' && isMyTurn && lobby.canKnock) ? 'inline-flex' : 'none';
            nextHandBtn.style.display = lobby.gameState === 'roundOver' ? 'inline-flex' : 'none';

            // Draw Pool (Dealer Draw / Tie Breaker)
            const poolContainer = document.getElementById('draw-pool-container');
            const poolGrid = document.getElementById('pool-grid');
            if (lobby.gameState === 'dealerDraw' || lobby.gameState === 'tieBreaker') {
                poolContainer.style.display = 'flex';
                poolGrid.innerHTML = '';
                lobby.drawPool.forEach(item => {
                    const cardBtn = document.createElement('div');
                    cardBtn.className = 'pile deck-pile';
                    cardBtn.style.width = '48px';
                    cardBtn.style.height = '68px';
                    cardBtn.style.fontSize = '0.75rem';
                    cardBtn.innerText = item.chosenBy ? item.chosenBy.substring(0, 4) : '?';
                    if (!item.chosenBy) {
                        cardBtn.onclick = () => pickPoolCard(item.index);
                    }
                    poolGrid.appendChild(cardBtn);
                });
            } else {
                poolContainer.style.display = 'none';
            }
        }

        function calculateLocalScore(cards) {
            let sc = cards.length === 4 ? cards.slice(0, 3) : cards;
            if (!sc || sc.length === 0) return 0;
            let sums = {};
            sc.forEach(c => sums[c.suit] = (sums[c.suit] || 0) + c.points);
            if (sc.length === 3 && sc[0].val === sc[1].val && sc[0].val === sc[2].val) return 30.5;
            return Math.max(...Object.values(sums), 0);
        }

        function resetUI() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('leave-btn').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
        });
    </script>
</body>
</html>
