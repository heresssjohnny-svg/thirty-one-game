<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>31! Card Game</title>
    <style>
        :root {
            --bg-felt: #044e36;
            --accent-gold: #facc15;
            --accent-cyan: #38bdf8;
            --card-red: #ef4444;
            --card-black: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #022c22; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #0f172a; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; }
        h1 { font-size: 1.2rem; color: var(--accent-gold); }
        .header-btn-group { display: flex; gap: 6px; }
        button { background: #10b981; color: #fff; border: 1px solid #34d399; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.15s; font-size: 0.8rem; }
        button.secondary { background: #334155; border-color: #475569; }
        button.danger { background: #ef4444; border-color: #f87171; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        main { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        #main-menu { display: flex; flex-direction: column; gap: 12px; background: var(--panel-bg); padding: 24px; border-radius: 12px; border: 1px solid #334155; max-width: 380px; width: 90%; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.8rem; color: var(--text-muted); }
        input, select { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px; border-radius: 6px; outline: none; }
        .lobby-list-container { max-height: 140px; overflow-y: auto; background: #090d16; border-radius: 6px; padding: 4px; border: 1px solid #1e293b; }

        #game-view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 10px; }
        #center-notification-banner { display: none; position: absolute; top: 12%; background: rgba(0,0,0,0.85); border: 1px solid var(--accent-gold); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; z-index: 100; font-weight: bold; }
        #discard-pickup-topleft-modal { display: none; position: absolute; top: 48px; left: 10px; background: rgba(15,23,42,0.95); border: 1px solid var(--accent-gold); padding: 5px 8px; border-radius: 8px; font-size: 0.7rem; align-items: center; gap: 6px; z-index: 90; }
        #fed-card-topright-modal { display: none; background: rgba(15,23,42,0.95); border: 1px solid #ec4899; padding: 4px 8px; border-radius: 8px; font-size: 0.65rem; align-items: center; gap: 4px; }
        #knock-alert-modal { display: none; position: absolute; top: 18%; background: #ef4444; color: #fff; padding: 6px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; z-index: 101; animation: pulse 1s infinite alternate; }

        .table-oval { position: relative; width: 96%; max-width: 650px; height: 350px; background: radial-gradient(circle, #065f46 0%, #044e36 100%); border: 8px solid #0f172a; border-radius: 175px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
        .deck-center { display: flex; gap: 16px; align-items: center; z-index: 5; }
        .card-slot { width: 55px; height: 80px; border-radius: 6px; background: #fff; color: #000; border: 1px solid #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; cursor: pointer; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-slot.back { background: #1e3a8a; border: 2px solid #93c5fd; color: #93c5fd; font-size: 0.7rem; }
        .deck-counter { position: absolute; bottom: 2px; font-size: 0.6rem; color: #fff; }
        #center-turn-indicator { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); background: var(--accent-gold); color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; display: none; }

        .seat { position: absolute; display: flex; flex-direction: column; align-items: center; width: 95px; }
        .seat-name-area { background: rgba(15,23,42,0.9); padding: 4px 6px; border-radius: 6px; font-size: 0.65rem; border: 1px solid #334155; text-align: center; width: 100%; cursor: pointer; }
        .seat-0 { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .seat-1 { bottom: 40px; left: 10px; }
        .seat-2 { top: 40px; left: 10px; }
        .seat-3 { top: 6px; left: 50%; transform: translateX(-50%); }
        .seat-4 { top: 40px; right: 10px; }
        .seat-5 { bottom: 40px; right: 10px; }
        .current-turn-seat .seat-name-area { border-color: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }
        .dealer-badge { background: var(--accent-gold); color: #000; font-size: 0.55rem; padding: 1px 3px; border-radius: 2px; font-weight: bold; margin-left: 2px; }

        .my-hand-area { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .cards-flex { display: flex; gap: 8px; }
        .my-card { width: 62px; height: 90px; background: #fff; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.4); border: 2px solid transparent; }
        .my-card:hover { transform: translateY(-4px); border-color: var(--accent-gold); }
        .red-suit { color: var(--card-red); }
        .black-suit { color: var(--card-black); }
        .bottom-action-bar { display: flex; gap: 8px; width: 100%; justify-content: center; align-items: center; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel-bg); border: 1px solid #475569; border-radius: 10px; padding: 16px; width: 90%; max-width: 400px; text-align: center; }
        .pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; max-height: 220px; overflow-y: auto; padding: 6px; }
        .pool-card-item { width: 34px; height: 48px; background: #1e3a8a; border: 1px solid #60a5fa; color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .pool-card-item.revealed { background: #fff; color: #000; border-color: #cbd5e1; }
        #next-hand-overlay { position: absolute; z-index: 50; display: none; }
        @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <h1>31! Online</h1>
        <div class="header-btn-group">
            <button class="secondary" onclick="openLedgerModal()">Ledger</button>
            <button class="secondary" onclick="openSideBetsModal()">Side Bets</button>
            <button class="danger" onclick="leaveLobby()" id="leave-btn" style="display:none;">Leave</button>
        </div>
    </header>

    <main>
        <div id="main-menu">
            <h2 style="text-align:center; color:var(--accent-gold);">Join Game</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username-input" placeholder="Enter name..." value="Player1">
            </div>
            <button onclick="createLobby()">Create New Lobby</button>
            <div class="input-group">
                <label>Lobby Code</label>
                <input type="text" id="join-code-input" placeholder="Code">
                <button class="secondary" onclick="joinLobby()">Join by Code</button>
            </div>
            <div class="input-group">
                <label>Public Lobbies</label>
                <div class="lobby-list-container" id="lobby-list"></div>
            </div>
        </div>

        <div id="game-view">
            <div id="center-notification-banner">NOTIFICATION</div>
            <div id="knock-alert-modal">🔔 Knock Alert</div>
            
            <div id="discard-pickup-topleft-modal">
                <span id="discard-pickup-card-content"></span>
            </div>

            <div style="display:flex; justify-content:space-between; width:100%; max-width:600px; align-items:center;">
                <span id="room-title-display" style="font-weight:bold; color:var(--accent-gold); font-size:0.8rem;">Lobby</span>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
                    <div id="turn-banner" style="font-size:0.75rem;">Waiting...</div>
                    <div id="fed-card-topright-modal">
                        <span id="fed-card-label" style="color:var(--text-muted);">Took your card:</span>
                        <div id="fed-card-content" style="display:flex; align-items:center; gap:2px;"></div>
                    </div>
                </div>
            </div>

            <div id="lobby-config-bar" style="display:flex; gap:6px; align-items:center;">
                <select id="config-wager" onchange="updateSettings()" style="padding:2px 6px; font-size:0.75rem;">
                    <option value="5">$5 Wager</option>
                    <option value="10">$10 Wager</option>
                    <option value="20">$20 Wager</option>
                </select>
                <select id="config-lives" onchange="updateSettings()" style="padding:2px 6px; font-size:0.75rem;">
                    <option value="2">2 Lives</option>
                    <option value="3">3 Lives</option>
                    <option value="5">5 Lives</option>
                </select>
                <div id="bot-buttons-container" style="display:inline-flex; gap:4px;">
                    <button type="button" class="secondary" onclick="addBot()" style="padding:2px 8px; font-size:0.75rem; background:#2563eb; color:#fff; border:1px solid #3b82f6;">+bot</button>
                    <button type="button" class="secondary" onclick="removeBot()" style="padding:2px 8px; font-size:0.75rem; background:#475569; color:#fff; border:1px solid #64748b;">-bot</button>
                </div>
            </div>

            <div class="table-oval" id="table-oval-container">
                <div class="deck-center">
                    <div id="center-turn-indicator">YOUR TURN!</div>
                    <div class="card-slot back" onclick="drawCard('deck')">DECK<div class="deck-counter" id="deck-counter-val">0</div></div>
                    <div class="card-slot" id="discard-slot" onclick="drawCard('discard')">Empty</div>
                </div>
                <div id="next-hand-overlay">
                    <button onclick="clickNextHand()" style="padding:8px 16px; background:#10b981; font-size:0.9rem;">Next Hand</button>
                </div>
            </div>

            <div class="my-hand-area">
                <span style="font-size:0.75rem; color:var(--text-muted);">My Hand (Score: <b id="my-score-display" style="color:var(--accent-gold);">0</b>)</span>
                <div class="cards-flex" id="my-cards-container"></div>
                <div class="bottom-action-bar">
                    <button id="ready-btn" onclick="toggleReady()">Ready Up</button>
                    <button id="knock-btn" class="secondary" onclick="knockRound()" disabled>Knock</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="pool-modal" class="modal">
        <div class="modal-content">
            <h3 id="pool-modal-title" style="color:var(--accent-gold); margin-bottom:4px;">Dealer Draw</h3>
            <p id="pool-modal-instruction" style="font-size:0.75rem; color:var(--text-muted); margin-bottom:8px;">Choose a card</p>
            <div class="pool-grid" id="pool-cards-container"></div>
        </div>
    </div>

    <div id="ledger-modal" class="modal">
        <div class="modal-content" style="max-width:340px;">
            <h3 style="color:var(--accent-gold); margin-bottom:6px;">Ledger & Balances</h3>
            <div id="ledger-content" style="font-size:0.75rem; text-align:left; max-height:240px; overflow-y:auto; margin-bottom:8px;"></div>
            <button class="secondary" onclick="toggleModal('ledger-modal')">Close</button>
        </div>
    </div>

    <div id="sidebets-modal" class="modal">
        <div class="modal-content" style="max-width:320px;">
            <h3 style="color:var(--accent-gold); margin-bottom:8px;">Propose Side Bet</h3>
            <div class="input-group" style="text-align:left; margin-bottom:6px;">
                <label>Target Player</label>
                <select id="bet-target-user"></select>
            </div>
            <div class="input-group" style="text-align:left; margin-bottom:6px;">
                <label>Bet Type</label>
                <select id="bet-type-select">
                    <option value="eliminate">First to Lose Life</option>
                    <option value="win">To Win Match</option>
                </select>
            </div>
            <div class="input-group" style="text-align:left; margin-bottom:6px;">
                <label>Pick User</label>
                <select id="bet-pick-user"></select>
            </div>
            <div class="input-group" style="text-align:left; margin-bottom:8px;">
                <label>Amount ($)</label>
                <input type="number" id="bet-amount-input" value="5" min="1">
            </div>
            <div style="display:flex; gap:6px; justify-content:center;">
                <button onclick="submitSideBet()">Send Proposal</button>
                <button class="secondary" onclick="toggleModal('sidebets-modal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let clientState = {
            username: 'Player1',
            isReady: false,
            gameState: 'lobby',
            players: []
        };
        let latestLobbySnapshot = null;
        let hasChosenPoolCard = false;

        function connectSocket() {
            let protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host);

            ws.onmessage = (event) => {
                let data = JSON.parse(event.data);
                if (data.type === 'LOBBY_LIST') {
                    renderLobbyList(data.lobbies);
                } else if (data.type === 'LOBBY_UPDATE') {
                    latestLobbySnapshot = data.lobby;
                    renderGameView(data.lobby);
                }
            };
        }

        function sendMsg(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }

        function formatCardHtml(card, small = false) {
            if (!card) return '';
            let isRed = ['♥', '♦'].includes(card.suit);
            let cls = isRed ? 'red-suit' : 'black-suit';
            let sz = small ? 'font-size:0.75rem;' : 'font-size:1.1rem;';
            return `<span class="${cls}" style="${sz}">${card.val}${card.suit}</span>`;
        }

        function calculateScoreLocal(cards) {
            let scoringCards = cards.length === 4 ? cards.slice(0, 3) : cards;
            if (!scoringCards || scoringCards.length === 0) return 0;
            let suitSums = {};
            scoringCards.forEach(c => suitSums[c.suit] = (suitSums[c.suit] || 0) + c.points);
            if (scoringCards.length === 3 && scoringCards[0].val === scoringCards[1].val && scoringCards[0].val === scoringCards[2].val) return 30.5;
            return Math.max(...Object.values(suitSums), 0);
        }

        function calculatePairwiseNet(ledgerData, myName, allUsers) {
            let records = {};
            let totalNet = 0;
            allUsers.forEach(u => {
                if (u !== myName) {
                    let iOwe = ledgerData[myName]?.[u] || 0;
                    let theyOwe = ledgerData[u]?.[myName] || 0;
                    let net = theyOwe - iOwe;
                    if (net !== 0) {
                        records[u] = net;
                        totalNet += net;
                    }
                }
            });
            return { records, totalNet };
        }

        function renderGameView(lobby) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('leave-btn').style.display = 'block';
            document.getElementById('room-title-display').innerText = `${lobby.code} (${lobby.gameState.toUpperCase()})`;
            document.getElementById('turn-banner').innerText = lobby.phaseMessage || '';
            document.getElementById('deck-counter-val').innerText = `${lobby.deckCount || 0}`;

            let activeUsername = document.getElementById('username-input').value.trim() || clientState.username;
            let me = lobby.players.find(p => p.username.toLowerCase() === activeUsername.toLowerCase());

            // Knock alert
            let knockModal = document.getElementById('knock-alert-modal');
            if (lobby.knockedBy && (lobby.gameState === 'playing' || lobby.gameState === 'finalTurn')) {
                knockModal.innerText = `🔔 ${lobby.knockedBy} has knocked!`;
                knockModal.style.display = 'block';
            } else {
                knockModal.style.display = 'none';
            }

            // Top-left initial deal card modal
            let topleftModal = document.getElementById('discard-pickup-topleft-modal');
            let topleftCardContent = document.getElementById('discard-pickup-card-content');
            if (lobby.lastDiscardPickup && lobby.gameState !== 'roundOver' && lobby.gameState !== 'lobby') {
                topleftCardContent.innerHTML = `<span><b>${lobby.lastDiscardPickup.username}</b> drew initial card:</span> ${formatCardHtml(lobby.lastDiscardPickup.card, true)}`;
                topleftModal.style.display = 'flex';
            } else {
                topleftModal.style.display = 'none';
            }

            // Top-right fed card reminder modal
            let fedModal = document.getElementById('fed-card-topright-modal');
            let fedContent = document.getElementById('fed-card-content');
            let fedLabel = document.getElementById('fed-card-label');
            if (lobby.myFedCardReminder && lobby.gameState !== 'roundOver' && lobby.gameState !== 'lobby') {
                fedLabel.innerText = `${lobby.myFedCardReminder.target} took your card:`;
                fedContent.innerHTML = formatCardHtml(lobby.myFedCardReminder.card, true);
                fedModal.style.display = 'flex';
            } else {
                fedModal.style.display = 'none';
            }

            // Discard Top
            let discardSlot = document.getElementById('discard-slot');
            discardSlot.innerHTML = lobby.discardTop ? formatCardHtml(lobby.discardTop) : 'Empty';

            // Pool Modal (Dealer draw & Tie-breaker)
            let poolModal = document.getElementById('pool-modal');
            if (lobby.gameState === 'dealerDraw' || lobby.gameState === 'tieBreaker') {
                poolModal.style.display = 'flex';
                document.getElementById('pool-modal-title').innerText = lobby.gameState === 'dealerDraw' ? 'Dealer Draw Phase' : 'Tie-Breaker Draw Phase';
                document.getElementById('pool-modal-instruction').innerText = lobby.phaseMessage || 'Select a card from the deck pool.';

                let gridHtml = '';
                (lobby.drawPool || []).forEach(slot => {
                    if (slot.chosenBy) {
                        let rev = lobby.drawResults[slot.chosenBy];
                        gridHtml += `<div class="pool-card-item revealed"><span style="font-size:0.55rem; color:#475569;">${slot.chosenBy}</span>${rev ? formatCardHtml(rev, true) : ''}</div>`;
                    } else {
                        let canPick = !lobby.drawResults[activeUsername] && !hasChosenPoolCard;
                        gridHtml += `<div class="pool-card-item" ${canPick ? `onclick="choosePoolCard(${slot.index})"` : 'style="opacity:0.5; cursor:not-allowed;"'}>?</div>`;
                    }
                });
                document.getElementById('pool-cards-container').innerHTML = gridHtml;
            } else {
                poolModal.style.display = 'none';
                hasChosenPoolCard = false;
            }

            // Seats Rendering
            let container = document.getElementById('table-oval-container');
            let existingSeats = container.querySelectorAll('.seat');
            existingSeats.forEach(s => s.remove());

            lobby.players.forEach(p => {
                let isCurrentTurn = p.username.toLowerCase() === lobby.currentTurnUser.toLowerCase() && (lobby.gameState === 'playing' || lobby.gameState === 'finalTurn');
                let isDealer = lobby.players[lobby.dealerIndex]?.username === p.username;
                let statusBadge = p.eliminated ? ' [OUT]' : '';
                let readyIcon = p.ready ? '✅' : '⏳';
                let botBadge = p.isBot ? ' 🤖' : '';
                let dealerBadge = isDealer ? '<span class="dealer-badge">D</span>' : '';

                let seatDiv = document.createElement('div');
                seatDiv.className = `seat seat-${p.seat}${isCurrentTurn ? ' current-turn-seat' : ''}`;
                seatDiv.innerHTML = `
                    <div class="seat-name-area">
                        <span>${readyIcon}</span> <b>${p.username}${botBadge}${statusBadge}</b>${dealerBadge}<br>
                        Lives: ${p.lives} | Wager: $${p.wager || 5}
                    </div>
                `;
                container.appendChild(seatDiv);
            });

            // Turn Indicator
            let isMyTurn = lobby.currentTurnUser.toLowerCase() === activeUsername.toLowerCase() && (lobby.gameState === 'playing' || lobby.gameState === 'finalTurn');
            document.getElementById('center-turn-indicator').style.display = isMyTurn ? 'block' : 'none';

            // Next hand overlay
            let nextHandOverlay = document.getElementById('next-hand-overlay');
            if (lobby.gameState === 'roundOver' && me && !me.eliminated && !me.nextHandReady) {
                nextHandOverlay.style.display = 'block';
            } else {
                nextHandOverlay.style.display = 'none';
            }

            // Hand & Actions
            let knockBtn = document.getElementById('knock-btn');
            knockBtn.disabled = !isMyTurn || !lobby.canKnock || !!lobby.knockedBy;

            let readyBtn = document.getElementById('ready-btn');
            readyBtn.style.display = lobby.gameState === 'lobby' ? 'block' : 'none';
            readyBtn.innerText = (me && me.ready) ? 'Unready' : 'Ready Up';

            if (me && me.cards) {
                let cardsHtml = me.cards.map((c, i) => `
                    <div class="my-card ${['♥', '♦'].includes(c.suit) ? 'red-suit' : 'black-suit'}" onclick="discardCard(${i})">
                        <span>${c.val}</span><span>${c.suit}</span>
                    </div>
                `).join('');
                document.getElementById('my-cards-container').innerHTML = cardsHtml;
                document.getElementById('my-score-display').innerText = calculateScoreLocal(me.cards);
            }
        }

        function renderLobbyList(lobbies) {
            let container = document.getElementById('lobby-list');
            if (!lobbies || lobbies.length === 0) {
                container.innerHTML = '<div style="color:#64748b; font-size:0.75rem; padding:4px;">No public lobbies found.</div>';
                return;
            }
            container.innerHTML = lobbies.map(l => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:4px; border-bottom:1px solid #1e293b; font-size:0.75rem;">
                    <span><b>${l.name}</b> (${l.playerCount}/${l.maxPlayers})</span>
                    <button style="padding:2px 6px; font-size:0.7rem;" onclick="joinByCode('${l.code}')">Join</button>
                </div>
            `).join('');
        }

        function createLobby() {
            let username = document.getElementById('username-input').value.trim() || 'Player1';
            clientState.username = username;
            sendMsg({ type: 'CREATE_LOBBY', username });
        }

        function joinLobby() {
            let code = document.getElementById('join-code-input').value.trim();
            let username = document.getElementById('username-input').value.trim() || 'Player1';
            clientState.username = username;
            sendMsg({ type: 'JOIN_LOBBY', code, username });
        }

        function joinByCode(code) {
            let username = document.getElementById('username-input').value.trim() || 'Player1';
            clientState.username = username;
            sendMsg({ type: 'JOIN_LOBBY', code, username });
        }

        function addBot() { sendMsg({ type: 'ADD_BOT' }); }
        function removeBot() { sendMsg({ type: 'REMOVE_BOT' }); }
        function toggleReady() { sendMsg({ type: 'SET_READY' }); }
        function clickNextHand() { sendMsg({ type: 'NEXT_HAND_READY' }); }
        function choosePoolCard(cardIndex) {
            if (hasChosenPoolCard) return;
            hasChosenPoolCard = true;
            sendMsg({ type: 'CHOOSE_POOL_CARD', cardIndex });
        }
        function drawCard(type) { sendMsg({ type: type === 'deck' ? 'DRAW_DECK' : 'DRAW_DISCARD' }); }
        function discardCard(cardIndex) { sendMsg({ type: 'DISCARD_CARD', cardIndex }); }
        function knockRound() { sendMsg({ type: 'KNOCK' }); }

        function updateSettings() {
            let wager = document.getElementById('config-wager').value;
            let lives = document.getElementById('config-lives').value;
            sendMsg({ type: 'UPDATE_CONFIG', wager, lives });
        }

        function leaveLobby() {
            sendMsg({ type: 'LEAVE_LOBBY' });
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('leave-btn').style.display = 'none';
        }

        function openLedgerModal() {
            if (!latestLobbySnapshot) return;
            let myName = document.getElementById('username-input').value.trim() || clientState.username;
            let allUsers = latestLobbySnapshot.players.map(p => p.username);

            let sideLedger = latestLobbySnapshot.sideBetLedger || {};
            let mainLedger = latestLobbySnapshot.mainGameLedger || {};
            let botLedger = latestLobbySnapshot.botBetLedger || {};

            let sideCalc = calculatePairwiseNet(sideLedger, myName, allUsers);
            let mainCalc = calculatePairwiseNet(mainLedger, myName, allUsers);
            let botCalc = calculatePairwiseNet(botLedger, myName, allUsers);

            let totalNet = sideCalc.totalNet + mainCalc.totalNet;

            let html = `<div style="font-size:0.9rem; font-weight:bold; color:${totalNet >= 0 ? '#34d399' : '#f87171'}; margin-bottom:6px;">Total Net Balance: $${totalNet.toFixed(2)}</div><hr style="border-color:#334155; margin-bottom:6px;">`;

            // Human Side Bets
            html += `<div style="font-size:0.75rem; font-weight:bold; color:var(--accent-gold); margin-bottom:2px;">🤝 Side Bets</div>`;
            let sideKeys = Object.keys(sideCalc.records);
            if (sideKeys.length === 0) {
                html += `<div style="color:var(--text-muted); margin-bottom:6px;">No side bet balances.</div>`;
            } else {
                html += `<ul style="margin-left:14px; margin-bottom:6px;">`;
                for (let [u, net] of Object.entries(sideCalc.records)) {
                    let rel = net > 0 ? `<span style="color:#34d399;">owes you $${Math.abs(net).toFixed(2)}</span>` : `<span style="color:#f87171;">you owe $${Math.abs(net).toFixed(2)}</span>`;
                    html += `<li><b>${u}</b> ${rel}</li>`;
                }
                html += `</ul>`;
            }

            // Human Main Game Pot
            html += `<div style="font-size:0.75rem; font-weight:bold; color:var(--accent-gold); margin-bottom:2px;">🎮 Main Game Pot Ledger</div>`;
            let mainKeys = Object.keys(mainCalc.records);
            if (mainKeys.length === 0) {
                html += `<div style="color:var(--text-muted); margin-bottom:6px;">No main game balances recorded.</div>`;
            } else {
                html += `<ul style="margin-left:14px; margin-bottom:6px;">`;
                for (let [u, net] of Object.entries(mainCalc.records)) {
                    let rel = net > 0 ? `<span style="color:#34d399;">owes you $${Math.abs(net).toFixed(2)}</span>` : `<span style="color:#f87171;">you owe $${Math.abs(net).toFixed(2)}</span>`;
                    html += `<li><b>${u}</b> ${rel}</li>`;
                }
                html += `</ul>`;
            }

            // Separate Bot Bets Category (Not in Total Net)
            html += `<div style="font-size:0.75rem; font-weight:bold; color:var(--accent-cyan); margin-top:6px; margin-bottom:2px;">🤖 Bot Bets (Practice / Excluded from Total)</div>`;
            let botKeys = Object.keys(botCalc.records);
            if (botKeys.length === 0) {
                html += `<div style="color:var(--text-muted);">No bot bets recorded.</div>`;
            } else {
                html += `<ul style="margin-left:14px;">`;
                for (let [u, net] of Object.entries(botCalc.records)) {
                    let rel = net > 0 ? `<span style="color:#34d399;">owes you $${Math.abs(net).toFixed(2)}</span>` : `<span style="color:#f87171;">you owe $${Math.abs(net).toFixed(2)}</span>`;
                    html += `<li><b>${u}</b> ${rel}</li>`;
                }
                html += `</ul>`;
            }

            document.getElementById('ledger-content').innerHTML = html;
            toggleModal('ledger-modal');
        }

        function openSideBetsModal() {
            if (!latestLobbySnapshot) return;
            let targetSelect = document.getElementById('bet-target-user');
            let pickSelect = document.getElementById('bet-pick-user');
            let myName = document.getElementById('username-input').value.trim() || clientState.username;

            targetSelect.innerHTML = latestLobbySnapshot.players.filter(p => p.username !== myName && !p.eliminated).map(p => `<option value="${p.username}">${p.username}${p.isBot ? ' 🤖' : ''}</option>`).join('');
            pickSelect.innerHTML = latestLobbySnapshot.players.filter(p => !p.eliminated).map(p => `<option value="${p.username}">${p.username}</option>`).join('');

            toggleModal('sidebets-modal');
        }

        function submitSideBet() {
            let target = document.getElementById('bet-target-user').value;
            let betType = document.getElementById('bet-type-select').value;
            let pickUser = document.getElementById('bet-pick-user').value;
            let wagerAmt = document.getElementById('bet-amount-input').value;

            sendMsg({ type: 'PROPOSE_BET', target, betType, pickUser, wagerAmt });
            toggleModal('sidebets-modal');
        }

        function toggleModal(id) {
            let m = document.getElementById(id);
            if (!m) return;
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        window.onload = connectSocket;
    </script>
</body>
</html>
