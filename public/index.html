<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>31 Card Game</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4d3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1b4d3e; color: #fff;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      position: relative;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: bold; }
    .header-controls { display: flex; align-items: center; gap: 6px; }
    .status-box { background: rgba(0,0,0,0.35); padding: 8px; border-radius: 8px; font-size: 14px; text-align: center; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    .table {
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; background: #164033; border-radius: 12px; margin: 8px 0; padding: 10px;
    }
    .players-list { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
    .player-tag {
      background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 16px; font-size: 13px; display: flex; align-items: center; gap: 4px;
    }
    .player-tag.active { border: 2px solid #ffcc00; font-weight: bold; background: rgba(255,204,0,0.25); }
    .player-tag.spectator { opacity: 0.6; border: 1px dashed #aaa; }
    .player-tag.is-ready { border-left: 4px solid #4caf50; }
    
    .middle-piles { display: flex; gap: 24px; align-items: center; margin: 8px 0; }
    
    .card {
      width: 72px; height: 104px; min-width: 72px; min-height: 104px;
      background: #ffffff; border-radius: 8px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.35);
      user-select: none; border: 1px solid #ccc;
    }
    .card.red { color: #d32f2f; }
    .card.black { color: #111111; }
    .card.back { background: #0d47a1; border: 2px solid #ffffff; color: #ffffff; font-size: 13px; text-align: center; }
    .card.discard-highlight { outline: 3px solid #ffcc00; transform: translateY(-4px); }

    .hand-area { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
    .hand-cards { display: flex; gap: 10px; justify-content: center; min-height: 110px; }
    
    .action-bar { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
      background: #ffcc00; color: #111; cursor: pointer;
    }
    button.secondary { background: #e0e0e0; color: #222; }
    button.danger { background: #d32f2f; color: #fff; padding: 6px 12px; font-size: 13px; }
    button.voice-btn { background: #00897b; color: #fff; padding: 6px 10px; font-size: 13px; }
    button.voice-on { background: #e53935; color: #fff; padding: 6px 10px; font-size: 13px; }
    button.ready-on { background: #4caf50; color: #fff; }
    button:disabled { background: #555; color: #888; }

    .spectator-badge {
      background: #0288d1; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px;
    }

    /* TOP BANNER ANNOUNCEMENT (DISCARD PICKUPS) */
    .banner-announcement {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: #ff9800; color: #111; font-weight: 800; font-size: 14px;
      padding: 10px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 500; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none; text-align: center; border: 2px solid #fff;
    }
    .banner-announcement.show {
      transform: translateX(-50%) translateY(0);
    }

    .chat-btn {
      position: fixed; right: 12px; bottom: 70px;
      background: #0288d1; color: white; border-radius: 24px;
      padding: 8px 14px; font-size: 14px; display: flex; align-items: center;
      gap: 6px; z-index: 50; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .chat-badge {
      background: #d32f2f; color: white; border-radius: 50%;
      padding: 2px 6px; font-size: 11px; font-weight: bold; display: none;
    }
    .chat-panel {
      position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100%;
      background: #0f2d24; z-index: 200; display: flex; flex-direction: column;
      box-shadow: -4px 0 15px rgba(0,0,0,0.6); transition: right 0.25s ease-in-out;
    }
    .chat-panel.open { right: 0; }
    .chat-header {
      padding: 12px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .chat-body {
      flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .chat-msg {
      background: rgba(255,255,255,0.08); padding: 6px 10px; border-radius: 8px; font-size: 13px; line-height: 1.3;
    }
    .chat-msg .sender { font-weight: bold; color: #ffcc00; font-size: 12px; margin-bottom: 2px; }
    .chat-msg .time { font-size: 10px; opacity: 0.6; float: right; margin-left: 8px; }
    .chat-msg.spec .sender { color: #81d4fa; }
    .chat-footer {
      padding: 10px; display: flex; gap: 6px; background: rgba(0,0,0,0.3);
    }
    .chat-input {
      flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 14px; background: #fff; color: #111;
    }

    .big-announcement-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; text-align: center; padding: 20px;
    }
    .big-announcement-overlay.show { opacity: 1; pointer-events: auto; }
    .ann-title { font-size: 24px; color: #ffcc00; letter-spacing: 2px; margin-bottom: 12px; font-weight: 800; }
    .ann-message { font-size: 30px; font-weight: 900; color: #ff3344; text-transform: uppercase; line-height: 1.2; text-shadow: 0 2px 12px rgba(255, 51, 68, 0.6); margin-bottom: 8px; }
    .ann-subtext { font-size: 16px; color: #ffffff; opacity: 0.9; }

    .lobby-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; z-index: 100;
    }
    input { padding: 12px; border-radius: 8px; border: none; font-size: 16px; width: 230px; }
  </style>
</head>
<body>

  <!-- BANNER ALERT FOR DISCARD PICKUP -->
  <div id="bannerAnnouncement" class="banner-announcement"></div>

  <button class="chat-btn" onclick="toggleChat()">
    💬 Chat <span id="chatBadge" class="chat-badge">0</span>
  </button>

  <div id="chatPanel" class="chat-panel">
    <div class="chat-header">
      <span>Table Chat</span>
      <span onclick="toggleChat()" style="cursor:pointer; font-size: 20px;">✕</span>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-footer">
      <input id="chatInput" class="chat-input" placeholder="Say something..." maxlength="140" onkeypress="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()" style="padding: 8px 12px; font-size: 13px;">Send</button>
    </div>
  </div>

  <div id="announcementOverlay" class="big-announcement-overlay">
    <div id="annTitle" class="ann-title">💀 ROUND OVER 💀</div>
    <div id="annMessage" class="ann-message">LOSER: BOT 1</div>
    <div id="annSubtext" class="ann-subtext">Lowest score: 14</div>
  </div>

  <div id="lobby" class="lobby-modal">
    <h2 style="margin:0;">31 Card Game</h2>
    <input id="playerName" placeholder="Your Name" />
    <input id="roomId" placeholder="Room Code (e.g. 777)" />
    <button onclick="joinGame()">Enter Game Room</button>
  </div>

  <div class="header">
    <div id="roomLabel">Room: -</div>
    <div id="scoreLabel">Score: 0</div>
    <div class="header-controls">
      <button id="voiceBtn" class="voice-btn" onclick="toggleVoice()">🎤 Join Voice</button>
      <button id="muteBtn" class="secondary" style="display:none; padding:6px 10px; font-size:13px;" onclick="toggleMute()">🎙️ Mute</button>
      <button class="danger" onclick="leaveLobby()">Leave</button>
    </div>
  </div>

  <div class="status-box" id="statusBar">Waiting for players or bots...</div>

  <div class="table">
    <div class="players-list" id="playersArea"></div>

    <div class="middle-piles">
      <div id="drawPile" class="card back" onclick="draw('deck')">DRAW<br>DECK</div>
      <div id="discardPile" class="card" onclick="draw('discard')">--</div>
    </div>

    <div class="hand-area">
      <div id="handInstruction" style="font-size: 13px; opacity: 0.85;">Your Hand</div>
      <div class="hand-cards" id="handArea">
        <div style="opacity: 0.5; margin-top: 40px; font-size: 14px;">(No cards dealt yet)</div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar">
    <button id="readyBtn" onclick="toggleReady()">⏳ Tap to Ready</button>
    <button id="addBotBtn" class="secondary" onclick="addBot()">+ Add Bot</button>
    <button id="knockBtn" onclick="knock()" disabled>Knock</button>
  </div>

  <div id="audioContainer"></div>

  <script>
    const socket = io();
    let currentRoom = '';
    let myHand = [];
    let isTurn = false;
    let hasDrawn = false;
    let minKnockScore = 21;
    let currentScore = 0;
    let roundHasPassed = false;
    let isSpectator = false;
    let isReady = false;
    let unreadCount = 0;
    let isChatOpen = false;

    let localStream = null;
    let peerConnections = {};
    let isInVoice = false;
    let isMuted = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function joinGame() {
      const name = document.getElementById('playerName').value.trim() || 'Player';
      const room = document.getElementById('roomId').value.trim();
      if (!room) return alert('Enter a room code');
      currentRoom = room;
      socket.emit('joinRoom', { roomId: room, playerName: name });
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('roomLabel').innerText = `Room: ${room}`;
    }

    function leaveLobby() {
      if (!currentRoom) return;
      if (confirm('Leave this game room?')) {
        if (isInVoice) leaveVoice();
        socket.emit('leaveRoom', currentRoom);
        currentRoom = '';
        myHand = [];
        document.getElementById('lobby').style.display = 'flex';
        document.getElementById('roomLabel').innerText = 'Room: -';
        document.getElementById('scoreLabel').innerText = 'Score: 0';
        document.getElementById('handArea').innerHTML = '<div style="opacity: 0.5; margin-top: 40px; font-size: 14px;">(No cards dealt yet)</div>';
        document.getElementById('playersArea').innerHTML = '';
      }
    }

    async function toggleVoice() {
      if (!isInVoice) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isInVoice = true;
          isMuted = false;
          document.getElementById('voiceBtn').className = 'voice-on';
          document.getElementById('voiceBtn').innerText = '🔴 Leave Voice';
          document.getElementById('muteBtn').style.display = 'inline-block';
          document.getElementById('muteBtn').innerText = '🎙️ Mute';
          socket.emit('joinVoice', currentRoom);
        } catch (err) {
          alert('Microphone access denied or unavailable: ' + err.message);
        }
      } else {
        leaveVoice();
      }
    }

    function leaveVoice() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      Object.keys(peerConnections).forEach(id => {
        if (peerConnections[id]) peerConnections[id].close();
      });
      peerConnections = {};
      document.getElementById('audioContainer').innerHTML = '';
      isInVoice = false;
      document.getElementById('voiceBtn').className = 'voice-btn';
      document.getElementById('voiceBtn').innerText = '🎤 Join Voice';
      document.getElementById('muteBtn').style.display = 'none';
      socket.emit('leaveVoice', currentRoom);
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
      });
      document.getElementById('muteBtn').innerText = isMuted ? '🔇 Unmute' : '🎙️ Mute';
    }

    function createPeerConnection(targetSocketId, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('voiceSignal', {
            target: targetSocketId,
            signal: { candidate: event.candidate }
          });
        }
      };

      pc.ontrack = (event) => {
        let audioEl = document.getElementById(`audio_${targetSocketId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${targetSocketId}`;
          audioEl.autoplay = true;
          audioEl.playsInline = true;
          document.getElementById('audioContainer').appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
      };

      if (isInitiator) {
        pc.onnegotiationneeded = async () => {
          try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('voiceSignal', {
              target: targetSocketId,
              signal: { description: pc.localDescription }
            });
          } catch (err) {
            console.error('Offer error:', err);
          }
        };
      }

      return pc;
    }

    socket.on('currentVoiceUsers', (users) => {
      users.forEach(userId => {
        createPeerConnection(userId, true);
      });
    });

    socket.on('voiceUserJoined', ({ socketId }) => {
      createPeerConnection(socketId, false);
    });

    socket.on('voiceUserLeft', ({ socketId }) => {
      if (peerConnections[socketId]) {
        peerConnections[socketId].close();
        delete peerConnections[socketId];
      }
      const audioEl = document.getElementById(`audio_${socketId}`);
      if (audioEl) audioEl.remove();
    });

    socket.on('voiceSignal', async ({ sender, signal }) => {
      let pc = peerConnections[sender];
      if (!pc) pc = createPeerConnection(sender, false);

      try {
        if (signal.description) {
          await pc.setRemoteDescription(new RTCSessionDescription(signal.description));
          if (signal.description.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('voiceSignal', {
              target: sender,
              signal: { description: pc.localDescription }
            });
          }
        } else if (signal.candidate) {
          await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
        }
      } catch (err) {
        console.error('Signal handling error:', err);
      }
    });

    function toggleReady() {
      socket.emit('toggleReady', currentRoom);
    }

    function toggleChat() {
      isChatOpen = !isChatOpen;
      const panel = document.getElementById('chatPanel');
      panel.classList.toggle('open', isChatOpen);
      if (isChatOpen) {
        unreadCount = 0;
        document.getElementById('chatBadge').style.display = 'none';
        setTimeout(() => document.getElementById('chatInput').focus(), 150);
      }
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;
      socket.emit('sendChatMessage', { roomId: currentRoom, message: val });
      input.value = '';
    }

    socket.on('newChatMessage', (data) => {
      const body = document.getElementById('chatBody');
      const msg = document.createElement('div');
      msg.className = `chat-msg ${data.isSpectator ? 'spec' : ''}`;
      msg.innerHTML = `
        <div>
          <span class="sender">${data.sender}${data.isSpectator ? ' [👁️]' : ''}</span>
          <span class="time">${data.time}</span>
        </div>
        <div>${data.text}</div>
      `;
      body.appendChild(msg);
      body.scrollTop = body.scrollHeight;

      if (!isChatOpen) {
        unreadCount++;
        const badge = document.getElementById('chatBadge');
        badge.innerText = unreadCount;
        badge.style.display = 'inline-block';
      }
    });

    function addBot() {
      socket.emit('addBot', currentRoom);
    }

    function draw(source) {
      if (isSpectator) return;
      if (!isTurn) return alert("Not your turn!");
      if (hasDrawn) return alert("You already drew. Tap a card in your hand to discard.");
      socket.emit('drawCard', { roomId: currentRoom, source });
    }

    function discard(idx) {
      if (isSpectator) return;
      if (!isTurn) return;
      if (!hasDrawn) return alert("You must draw from the deck or discard pile first!");
      socket.emit('discardCard', { roomId: currentRoom, cardIndex: idx });
    }

    function knock() {
      if (isSpectator) return;
      if (!isTurn) return alert("You can only knock on your turn!");
      if (hasDrawn) return alert("You must knock BEFORE drawing a card!");
      if (!roundHasPassed) {
        return alert("1 full round must go by before anyone can knock!");
      }
      if (currentScore < minKnockScore) {
        return alert(`You need at least ${minKnockScore} points to knock (you have ${currentScore}).`);
      }
      socket.emit('knock', currentRoom);
    }

    function renderCard(card, onClick, highlight = false) {
      const el = document.createElement('div');
      const isRed = card.suit === '♥' || card.suit === '♦';
      el.className = `card ${isRed ? 'red' : 'black'} ${highlight ? 'discard-highlight' : ''}`;
      el.innerHTML = `<span>${card.rank}</span><span style="font-size: 20px;">${card.suit}</span>`;
      if (onClick) el.onclick = onClick;
      return el;
    }

    // Top banner discard announcement
    let bannerTimer = null;
    socket.on('bannerAnnouncement', (data) => {
      const banner = document.getElementById('bannerAnnouncement');
      banner.innerText = data.text;
      banner.classList.add('show');
      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, data.duration || 3200);
    });

    socket.on('gameState', (state) => {
      isTurn = state.isMyTurn;
      hasDrawn = state.hasDrawn;
      myHand = state.hand || [];
      minKnockScore = state.minKnockScore || 21;
      roundHasPassed = state.roundHasPassed;
      currentScore = state.score || 0;
      isSpectator = Boolean(state.isSpectator);
      isReady = Boolean(state.isReady);

      if (isSpectator) {
        document.getElementById('scoreLabel').innerHTML = `<span class="spectator-badge">👁️ Spectating</span>`;
      } else {
        const scoreDisplay = (currentScore === 30.5) ? '30.5 (3 of a Kind!)' : currentScore;
        document.getElementById('scoreLabel').innerText = `Score: ${scoreDisplay}`;
      }

      if (state.message) document.getElementById('statusBar').innerText = state.message;

      const readyBtn = document.getElementById('readyBtn');
      const addBotBtn = document.getElementById('addBotBtn');

      if (isSpectator || state.gameStarted) {
        readyBtn.style.display = 'none';
        addBotBtn.style.display = 'none';
      } else {
        readyBtn.style.display = 'inline-block';
        addBotBtn.style.display = (state.activePlayersCount >= 6) ? 'none' : 'inline-block';

        if (isReady) {
          readyBtn.className = 'ready-on';
          readyBtn.innerText = '✅ You are Ready';
        } else {
          readyBtn.className = '';
          readyBtn.innerText = '⏳ Tap to Ready';
        }
      }

      const knockBtn = document.getElementById('knockBtn');
      if (isSpectator || !state.gameStarted) {
        knockBtn.style.display = 'none';
      } else {
        knockBtn.style.display = 'inline-block';
        if (state.knocker) {
          knockBtn.disabled = true;
          knockBtn.innerText = `Knocked by ${state.knocker}`;
        } else {
          knockBtn.disabled = !state.canKnock;
          if (!roundHasPassed) {
            knockBtn.innerText = `Knock (Round 1 active)`;
          } else if (state.canKnock) {
            knockBtn.innerText = `⚡ Knock Now (${minKnockScore}+)!`;
          } else {
            knockBtn.innerText = `Knock (Need ${minKnockScore}+)`;
          }
        }
      }

      const handInstr = document.getElementById('handInstruction');
      if (isSpectator) {
        handInstr.innerText = "You are spectating (6 active players limit or joined mid-game)";
      } else if (state.gameStarted) {
        if (isTurn) {
          handInstr.innerText = hasDrawn ? "Tap a card below to DISCARD it" : "Your turn! Tap Draw Deck or Discard Pile";
        } else {
          handInstr.innerText = "Waiting for other players...";
        }
      } else {
        const eligible = state.players.filter(p => !p.isSpectator);
        const readyCount = eligible.filter(p => p.isReady || p.isBot).length;
        handInstr.innerText = `Lobby (${eligible.length}/6 Players) — Ready: ${readyCount}/${eligible.length}`;
      }

      const pArea = document.getElementById('playersArea');
      pArea.innerHTML = '';
      state.players.forEach(p => {
        const div = document.createElement('div');
        const voiceBadge = p.isInVoice ? ' 🎙️' : '';
        if (p.isSpectator) {
          div.className = 'player-tag spectator';
          div.innerText = `👁️ ${p.name}${voiceBadge}`;
        } else {
          div.className = `player-tag ${p.isTurn ? 'active' : ''} ${p.isReady ? 'is-ready' : ''}`;
          const readyMarker = (!state.gameStarted && (p.isReady || p.isBot)) ? '✓ ' : '';
          div.innerText = `${readyMarker}${p.name} (${p.lives} ❤️)${p.isDealer ? ' [D]' : ''}${voiceBadge}`;
        }
        pArea.appendChild(div);
      });

      const disc = document.getElementById('discardPile');
      if (state.topDiscard) {
        const isRed = state.topDiscard.suit === '♥' || state.topDiscard.suit === '♦';
        disc.className = `card ${isRed ? 'red' : 'black'}`;
        disc.innerHTML = `<span>${state.topDiscard.rank}</span><span style="font-size: 20px;">${state.topDiscard.suit}</span>`;
      } else {
        disc.className = 'card';
        disc.innerText = '--';
      }

      const hArea = document.getElementById('handArea');
      hArea.innerHTML = '';
      if (isSpectator) {
        hArea.innerHTML = '<div style="opacity: 0.7; margin-top: 35px; font-size: 15px;">Watching game as a spectator...</div>';
      } else if (myHand.length > 0) {
        myHand.forEach((card, idx) => {
          hArea.appendChild(renderCard(card, () => discard(idx), isTurn && hasDrawn));
        });
      } else {
        hArea.innerHTML = '<div style="opacity: 0.5; margin-top: 40px; font-size: 14px;">(No cards dealt yet)</div>';
      }
    });

    socket.on('bigAnnouncement', (data) => {
      const overlay = document.getElementById('announcementOverlay');
      document.getElementById('annTitle').innerText = data.title || 'ROUND OVER';
      document.getElementById('annMessage').innerText = data.message || '';
      document.getElementById('annSubtext').innerText = data.subtext || '';
      overlay.classList.add('show');

      setTimeout(() => {
        overlay.classList.remove('show');
      }, data.duration || 3500);
    });

    socket.on('errorMsg', (msg) => alert(msg));
    socket.on('gameOver', ({ winner }) => {
      setTimeout(() => location.reload(), 4500);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
