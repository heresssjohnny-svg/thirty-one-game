<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Blitz 31 Feature Graphic</title>
    <style>
        body {
            background: #070b12;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            color: #f59e0b;
            margin: 0 0 10px 0;
        }
        p {
            color: #94a3b8;
            margin: 0 0 20px 0;
            font-size: 0.9rem;
        }
        canvas {
            border: 2px solid #d4af37;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 12px 36px rgba(0,0,0,0.8);
        }
        button {
            margin-top: 20px;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #04140b;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            padding: 12px 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s ease;
        }
        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h2>Blitz 31 - Feature Graphic Generator</h2>
    <p>1024 × 500 px • Google Play Store Compliant</p>

    <canvas id="featureCanvas" width="1024" height="500"></canvas>
    
    <button onclick="downloadGraphic()">Download 1024x500 PNG</button>

<script>
    const canvas = document.getElementById('featureCanvas');
    const ctx = canvas.getContext('2d');

    function drawGraphic() {
        // 1. Background Casino Radial Felt
        const bgGrad = ctx.createRadialGradient(512, 250, 50, 512, 250, 600);
        bgGrad.addColorStop(0, '#155e3b');
        bgGrad.addColorStop(0.5, '#0a3521');
        bgGrad.addColorStop(1, '#04140b');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1024, 500);

        // 2. Subtle Felt Table Oval Ring
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(512, 250, 480, 220, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(512, 250, 450, 200, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();

        // 3. Decorative Corner Gold Filigree Borders
        drawCornerAccents();

        // 4. Render Left-Side Winning "31" Card Hand (A♠, K♠, 10♠ = 31 pts)
        drawFannedHand(170, 270);

        // 5. Render Right-Side Casino Chip Stack
        drawChipStack(840, 280);

        // 6. Central Branding / Game Logo
        drawCenterBranding();
    }

    function drawCornerAccents() {
        ctx.save();
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
        ctx.lineWidth = 2;
        
        // Outer thin gold border
        ctx.strokeRect(16, 16, 992, 468);
        
        // Inner accents
        ctx.strokeRect(22, 22, 980, 456);
        ctx.restore();
    }

    function drawCard(x, y, angle, val, suit, isRed) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle * Math.PI / 180);

        // Card Drop Shadow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetX = 6;
        ctx.shadowOffsetY = 10;

        // Card Body
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(-55, -80, 110, 160, 8);
        ctx.fill();

        // Reset shadow for card text
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Suit Color
        ctx.fillStyle = isRed ? '#dc2626' : '#0f172a';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(val, -45, -55);
        ctx.font = '18px sans-serif';
        ctx.fillText(suit, -45, -36);

        // Center Pip
        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(suit, 0, 5);

        // Bottom Inverted Pip
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(val, 45, 68);

        ctx.restore();
    }

    function drawFannedHand(cx, cy) {
        drawCard(cx - 30, cy + 15, -18, '10', '♠', false);
        drawCard(cx, cy - 5, -3, 'K', '♠', false);
        drawCard(cx + 35, cy + 10, 14, 'A', '♠', false);

        // Hand Score Badge
        ctx.save();
        ctx.fillStyle = 'rgba(4, 20, 13, 0.95)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(cx - 45, cy + 78, 100, 32, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('BLITZ: 31!', cx + 5, cy + 94);
        ctx.restore();
    }

    function drawChipStack(cx, cy) {
        const chipColors = ['#dc2626', '#2563eb', '#16a34a', '#d97706', '#dc2626'];
        
        chipColors.forEach((color, i) => {
            const y = cy + 40 - (i * 22);
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 6;

            // Chip base
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(cx, y, 52, 22, 0, 0, Math.PI * 2);
            ctx.fill();

            // White edge stripes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 12]);
            ctx.beginPath();
            ctx.ellipse(cx, y, 48, 19, 0, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Ring
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(cx, y, 32, 12, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        });

        // Pot Label Badge
        ctx.save();
        ctx.fillStyle = 'rgba(4, 20, 13, 0.95)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(cx - 50, cy + 78, 100, 32, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('POT: $310', cx, cy + 94);
        ctx.restore();
    }

    function drawCenterBranding() {
        ctx.save();
        ctx.textAlign = 'center';

        // Top Eyebrow Tag
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.letterSpacing = '3px';
        ctx.fillText('REAL-TIME MULTIPLAYER CARD GAME', 512, 145);

        // Main Title "BLITZ 31" Glow & Shadow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 8;

        // Metallic Gold Title Gradient
        const goldGrad = ctx.createLinearGradient(512, 160, 512, 260);
        goldGrad.addColorStop(0, '#fef08a');
        goldGrad.addColorStop(0.4, '#f59e0b');
        goldGrad.addColorStop(0.7, '#d97706');
        goldGrad.addColorStop(1, '#92400e');

        ctx.fillStyle = goldGrad;
        ctx.font = '900 84px sans-serif';
        ctx.fillText('BLITZ 31', 512, 240);

        // Gold Title Outline
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeText('BLITZ 31', 512, 240);

        // Feature Pill Callouts
        ctx.shadowColor = 'transparent';
        const pills = ['♠ LIVE VOICE CHAT', '•', 'MULTIPLAYER TABLES', '•', 'ZERO HOUSE EDGE'];
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(pills.join('  '), 512, 290);

        // Bottom Subtitle
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14
